<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ТЕЗИС — кабинет подготовки к ЕГЭ</title>
<style>
  :root{
    --cream:#F4F0E8; --paper:#fff; --ink:#14110F; --muted:#6B6459; --line:#E2DCD1;
    --accent:#C14E31; --accent-soft:#F7E9E4; --olive:#4A5340; --ok:#3F6B4A; --blue:#3A5A78;
    --fire:#E67E22; --urgent:#B83232;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--cream);color:var(--ink);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
    transition:background .6s ease}
  .display{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.02em;line-height:1.12}
  .container{max-width:1000px;margin:0 auto;padding:0 20px}
  .muted{color:var(--muted)}
  hr.hr{border:none;border-top:1px solid var(--line);margin:24px 0}

  /* ============ СЕЗОННЫЕ ФОНЫ (едва заметные) ============ */
  body.season-autumn{background:linear-gradient(180deg,#F5EFE5 0%,#EFE6D6 100%)}
  body.season-winter{background:linear-gradient(180deg,#F2F4F7 0%,#E8EEF3 100%)}
  body.season-spring{background:linear-gradient(180deg,#F6F1EC 0%,#F0EAE0 100%)}
  body.season-summer{background:linear-gradient(180deg,#FBF8F0 0%,#F4EFE0 100%)}

  .topbar{position:sticky;top:0;z-index:50;background:rgba(244,240,232,.88);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1000px;margin:0 auto;padding:0 20px;height:62px;
    display:flex;align-items:center;justify-content:space-between;gap:16px}
  .logo{font-family:Georgia,serif;font-size:19px;letter-spacing:.1em;font-weight:700;position:relative;
    display:flex;align-items:center;gap:10px}
  .logo span.red{color:var(--accent)}
  .logo-badge{position:absolute;top:-6px;right:-16px;background:var(--accent);color:#fff;
    font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;font-family:-apple-system,sans-serif;letter-spacing:0}
  .season-badge{font-size:10.5px;padding:3px 9px;background:rgba(20,17,15,.06);
    border-radius:999px;color:var(--muted);letter-spacing:.04em;font-weight:500;
    font-family:-apple-system,sans-serif;text-transform:none}

  .who{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
  .who .notif-btn{font-size:16px;background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:8px}
  .who .notif-btn:hover{background:var(--accent-soft)}
  .who .notif-btn.on{color:var(--ok)}
  .who .notif-btn.off{color:var(--muted);opacity:.5}

  .avatar-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
    font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:.18s}
  .avatar-btn:hover{border-color:var(--ink);transform:scale(1.06)}
  .avatar-small{width:30px;height:30px;border-radius:50%;background:var(--cream);display:inline-flex;
    align-items:center;justify-content:center;font-size:16px;flex-shrink:0}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 20px;border-radius:999px;font-size:14px;font-weight:500;font-family:inherit;
    cursor:pointer;border:1px solid transparent;transition:.18s;background:none;color:inherit;white-space:nowrap}
  .btn-primary{background:var(--ink);color:var(--cream)}
  .btn-primary:hover{background:var(--accent)}
  .btn-ghost{border-color:var(--line);color:var(--ink);background:var(--paper)}
  .btn-ghost:hover{border-color:var(--ink)}
  .btn-sm{padding:8px 15px;font-size:13px}
  .btn-danger{color:var(--accent);padding:8px 12px;font-size:13px}
  .btn-danger:hover{background:var(--accent-soft)}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding:16px 0 0;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer;
    border:1px solid transparent;background:transparent;color:var(--muted);font-family:inherit;
    white-space:nowrap;transition:.18s;display:inline-flex;align-items:center;gap:7px}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--ink);color:var(--cream)}
  .tab .cnt{background:var(--accent);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600}

  .page{padding:22px 0 80px}

  .input,.select,.textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;
    background:var(--paper);font-family:inherit;font-size:14.5px;color:var(--ink);transition:.18s;outline:none}
  .input:focus,.select:focus,.textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,17,15,.06)}
  .textarea{min-height:120px;resize:vertical;line-height:1.55}
  .label{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin-bottom:7px}
  .field{margin-bottom:15px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row-3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px}
  .h1{font-size:clamp(24px,3.6vw,34px)}
  .h2{font-size:19px;font-weight:600;margin-bottom:16px;letter-spacing:-.01em}
  .h3{font-size:16px;font-weight:600;margin-bottom:4px}

  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .badge{display:inline-flex;align-items:center;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;font-weight:600;padding:4px 10px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent)}
  .badge.neutral{background:#EDE9E1;color:var(--muted)}
  .badge.ok{background:#E3EDE5;color:var(--ok)}
  .badge.blue{background:#E4EBF1;color:var(--blue)}
  .badge.fire{background:#FCEBD9;color:var(--fire)}
  .badge.urgent{background:#F7DADA;color:var(--urgent);font-weight:700}

  .task{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:var(--paper);
    margin-bottom:12px;transition:.18s;cursor:pointer}
  .task:hover{border-color:var(--ink);transform:translateY(-1px)}
  .task.urgent{border-color:#E8B5B5; background:linear-gradient(180deg,#FFF8F6 0%,#fff 100%)}
  .task-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .meta{font-size:13px;color:var(--muted)}
  .score{font-family:Georgia,serif;font-size:20px;white-space:nowrap}

  .empty{border:1px dashed var(--line);border-radius:12px;padding:40px 24px;text-align:center;
    color:var(--muted);font-size:14.5px}

  .block-label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin:20px 0 8px}
  .block-label:first-child{margin-top:0}
  .answer{background:var(--cream);border-radius:8px;padding:14px 16px;font-size:14.5px;
    white-space:pre-wrap;word-break:break-word}
  .link{display:inline-block;margin-top:10px;font-size:14px;color:var(--accent);
    text-decoration:none;border-bottom:1px solid var(--accent-soft)}
  .link:hover{border-color:var(--accent)}
  .notice{margin-top:16px;padding:12px 16px;border-radius:8px;background:#E4EBF1;
    color:var(--blue);font-size:13.5px}
  .result{margin-top:20px;padding:24px;border-radius:14px;background:#E3EDE5;text-align:center}
  .result-score{font-family:Georgia,serif;font-size:44px;line-height:1;color:var(--ok)}
  .result-score span{font-size:20px;color:var(--muted)}
  .result-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ok);font-weight:600;margin-top:6px}
  .result-reaction{font-size:56px;margin-top:14px;line-height:1;animation:popIn .5s cubic-bezier(.68,-0.55,.27,1.55)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .stat .n{font-family:Georgia,serif;font-size:26px;line-height:1;margin-bottom:6px}
  .stat .l{font-size:11.5px;color:var(--muted);letter-spacing:.03em}

  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);
    border-radius:16px;padding:38px 32px}
  .login-sub{color:var(--muted);font-size:14px;margin:10px 0 26px}
  .roles{display:flex;gap:6px;background:var(--cream);padding:5px;border-radius:999px;margin-bottom:24px}
  .role{flex:1;padding:10px;border-radius:999px;border:none;background:transparent;
    font-family:inherit;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:.18s}
  .role.active{background:var(--ink);color:var(--cream)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5}

  .pills{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .pill{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
    font-size:13px;font-family:inherit;color:var(--muted);cursor:pointer;transition:.18s}
  .pill:hover{border-color:var(--ink);color:var(--ink)}
  .pill.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}

  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);transition:.18s}
  .photos img:hover{opacity:.85}
  .photo-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .photo-thumb{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;
    border:1px solid var(--line)}
  .photo-thumb img{width:100%;height:100%;object-fit:cover}
  .photo-thumb .rm{position:absolute;top:2px;right:2px;background:rgba(20,17,15,.75);color:#fff;
    border:none;width:20px;height:20px;border-radius:999px;font-size:13px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .file-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;
    border:1px dashed var(--line);background:var(--paper);font-size:13.5px;font-family:inherit;
    color:var(--muted);cursor:pointer;transition:.18s}
  .file-btn:hover{border-color:var(--ink);color:var(--ink)}
  .file-btn.loading{opacity:.6;cursor:wait}

  /* ==================================================
     НОВЫЙ ДИЗАЙН СТРАНИЦЫ УЧЕНИКА
     ================================================== */

  /* Hero */
  .hero-card{
    border-radius:20px;padding:22px 24px;margin-bottom:16px;
    background:var(--paper);border:1px solid var(--line);
    position:relative;overflow:hidden;
  }
  .hero-card.lv-0{background:linear-gradient(135deg,#FAF6EF 0%,#F2EBDE 100%);border-color:#E5DCC9}
  .hero-card.lv-1{background:linear-gradient(135deg,#FFF6E7 0%,#FFE9C7 100%);border-color:#F2D8AC}
  .hero-card.lv-2{background:linear-gradient(135deg,#FFEED8 0%,#FFD9A2 100%);border-color:#EFCA89}
  .hero-card.lv-3{background:linear-gradient(135deg,#FFE2B6 0%,#F5B94A 100%);border-color:#E5A435;color:#3A2500}
  .hero-card.lv-4{background:linear-gradient(135deg,#F5A623 0%,#E67E22 100%);border-color:#D97214;color:#fff}
  .hero-card.lv-5{background:linear-gradient(135deg,#7B68EE 0%,#4A3FCD 100%);border-color:#3D32B8;color:#fff}
  .hero-card.lv-3 .hero-num, .hero-card.lv-3 .hero-lvl, .hero-card.lv-3 .hero-quote,
  .hero-card.lv-3 .hero-progress-text { color:#3A2500 }
  .hero-card.lv-4 .hero-num, .hero-card.lv-4 .hero-lvl, .hero-card.lv-4 .hero-quote,
  .hero-card.lv-4 .hero-progress-text,
  .hero-card.lv-5 .hero-num, .hero-card.lv-5 .hero-lvl, .hero-card.lv-5 .hero-quote,
  .hero-card.lv-5 .hero-progress-text { color:#fff }

  .hero-header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
  .hero-streak{display:flex;align-items:center;gap:14px;min-width:0}
  .hero-emoji{font-size:38px;line-height:1;flex-shrink:0}
  .hero-info{min-width:0}
  .hero-num{font-family:Georgia,serif;font-size:28px;line-height:1;font-weight:700;
    color:#8B4513;letter-spacing:-.02em}
  .hero-num span{font-size:13px;font-family:-apple-system,sans-serif;font-weight:500;opacity:.6;letter-spacing:0}
  .hero-lvl{font-size:12.5px;margin-top:3px;color:#8B4513;opacity:.85;font-weight:500}

  .hero-today .today-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(46,125,50,.14);color:#2E7D32;
    padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;
    white-space:nowrap;
  }
  .hero-card.lv-4 .hero-today .today-chip,
  .hero-card.lv-5 .hero-today .today-chip{
    background:rgba(255,255,255,.2); color:#fff
  }
  .hero-today .btn{
    background:#8B4513;color:#fff;padding:8px 16px;font-size:13px;border-radius:12px;
    white-space:nowrap;
  }
  .hero-today .btn:hover{background:#6B3410}

  .hero-progress{margin-bottom:14px}
  .hero-progress-text{font-size:12px;margin-bottom:6px;color:#8B4513;opacity:.85;font-weight:500}
  .hero-progress-bar{
    height:7px;background:rgba(139,69,19,.15);border-radius:999px;overflow:hidden;
  }
  .hero-progress-bar > div{
    height:100%;background:#8B4513;border-radius:999px;transition:width .6s ease;
  }
  .hero-card.lv-4 .hero-progress-bar,
  .hero-card.lv-5 .hero-progress-bar{background:rgba(255,255,255,.25)}
  .hero-card.lv-4 .hero-progress-bar > div,
  .hero-card.lv-5 .hero-progress-bar > div{background:#fff}

  .hero-quote{
    font-family:Georgia,serif;font-style:italic;font-size:14px;line-height:1.45;
    color:#8B4513;opacity:.9;padding-top:14px;border-top:1px solid rgba(139,69,19,.14);
  }
  .hero-card.lv-4 .hero-quote,
  .hero-card.lv-5 .hero-quote{border-color:rgba(255,255,255,.2)}

  /* Actions row */
  .actions-row{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;
  }
  .action-tile{
    background:var(--paper);border:1px solid var(--line);border-radius:14px;
    padding:14px 8px;text-align:center;cursor:pointer;transition:.18s;
    font-family:inherit;color:var(--ink);display:flex;flex-direction:column;
    align-items:center;gap:5px;
  }
  .action-tile:hover{border-color:var(--ink);transform:translateY(-2px)}
  .action-tile .ico{font-size:22px;line-height:1}
  .action-tile .lbl{font-size:11.5px;color:var(--muted);letter-spacing:.02em;line-height:1.15;
    font-weight:500;text-align:center}
  .action-tile.primary{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .action-tile.primary .lbl{color:rgba(244,240,232,.75)}
  .action-tile.primary:hover{background:var(--accent);border-color:var(--accent)}
  .action-tile.primary:hover .lbl{color:rgba(255,255,255,.85)}

  /* Inline stats */
  .stats-inline{
    display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
    background:var(--paper);border:1px solid var(--line);border-radius:14px;
    padding:16px 12px;margin-bottom:24px;
  }
  .stats-inline .item{text-align:center;position:relative}
  .stats-inline .item:not(:last-child)::after{
    content:'';position:absolute;right:0;top:20%;bottom:20%;width:1px;background:var(--line)
  }
  .stats-inline .n{
    font-family:Georgia,serif;font-size:20px;line-height:1;display:block;margin-bottom:5px;
    color:var(--ink);
  }
  .stats-inline .l{
    font-size:10.5px;color:var(--muted);letter-spacing:.03em;text-transform:uppercase;
    font-weight:600;
  }

  /* Section title */
  .section-title{
    font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--ink);
    margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between;
  }
  .section-title:first-of-type{margin-top:0}
  .section-title .count{
    font-size:11px;color:var(--muted);font-weight:500;background:var(--cream);
    padding:3px 9px;border-radius:999px;letter-spacing:0;
  }

  /* ============ МОТИВАШКА / СТАРЫЕ КАРТОЧКИ (для куратора) ============ */
  .streak-card{
    background:linear-gradient(135deg, #FFF4E6 0%, #FFE4C7 100%);
    border:1px solid #F5D0A9; border-radius:16px; padding:22px 24px;
    margin-bottom:18px; position:relative; overflow:hidden;
  }
  .streak-card.lv-1{background:linear-gradient(135deg,#FFEEDD 0%,#FFD9A8 100%)}
  .streak-card.lv-2{background:linear-gradient(135deg,#FFE4C7 0%,#FFC77D 100%)}
  .streak-card.lv-3{background:linear-gradient(135deg,#FFD9A8 0%,#F5A623 100%)}
  .streak-card.lv-4{background:linear-gradient(135deg,#F5A623 0%,#E67E22 100%); color:#fff}
  .streak-card.lv-5{background:linear-gradient(135deg,#7B68EE 0%,#4A3FCD 100%); color:#fff}
  .streak-card.lv-5 .streak-num,.streak-card.lv-5 .streak-label{color:#fff}
  .streak-card.lv-5 .streak-label{opacity:.9}
  .streak-top{display:flex;align-items:center;gap:18px}
  .streak-emoji{font-size:48px; line-height:1; filter:drop-shadow(0 3px 6px rgba(0,0,0,.15))}
  .streak-num{font-family:Georgia,serif; font-size:38px; line-height:1; color:#8B4513; font-weight:700}
  .streak-label{font-size:13px; color:#8B4513; opacity:.85; margin-top:3px}
  .streak-level-name{font-family:Georgia,serif; font-size:15px; font-style:italic;
    color:#8B4513; margin-top:2px; font-weight:600}
  .streak-status{margin-left:auto; text-align:right}
  .streak-status .today{font-size:13px; color:#2E7D32; font-weight:600; background:rgba(255,255,255,.6);
    padding:6px 12px; border-radius:999px}
  .streak-status .btn{background:var(--ink); color:#fff}
  .level-bar{margin-top:16px; background:rgba(255,255,255,.5); border-radius:999px; height:8px; overflow:hidden; position:relative}
  .level-bar-fill{height:100%; background:#8B4513; border-radius:999px; transition:width .6s ease}
  .level-bar-text{margin-top:6px; font-size:11.5px; opacity:.75}

  .motivation-card{
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:16px 20px; margin-bottom:18px; text-align:center;
    font-family:Georgia,serif; font-style:italic; font-size:15px; color:var(--ink);
    position:relative;
  }
  .motivation-card::before{content:'"'; position:absolute; top:-2px; left:14px;
    font-size:44px; color:var(--accent-soft); font-family:Georgia,serif; line-height:1}

  /* ============ АНИМАЦИИ ============ */
  .confetti-piece{position:fixed; width:10px; height:10px; top:-20px;
    pointer-events:none; z-index:2000; animation:fall linear forwards}
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1 }
    100%{ transform:translateY(110vh) rotate(720deg); opacity:0.6 }
  }
  @keyframes popIn{
    0%{ transform:scale(0); opacity:0 }
    60%{ transform:scale(1.15); opacity:1 }
    100%{ transform:scale(1); opacity:1 }
  }
  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  @keyframes pop{
    0%{ transform:scale(.6); opacity:0 }
    60%{ transform:scale(1.05); opacity:1 }
    100%{ transform:scale(1); opacity:1 }
  }

  /* ============ CELEBRATION MODAL ============ */
  .celebrate{position:fixed; inset:0; background:rgba(20,17,15,.55);
    z-index:2500; display:flex; align-items:center; justify-content:center; padding:24px;
    animation:fadeIn .25s ease}
  .celebrate-card{background:var(--paper); border-radius:20px; padding:40px 28px;
    text-align:center; max-width:340px; width:100%;
    animation:pop .5s cubic-bezier(.68,-0.55,.27,1.55);
    box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .celebrate-emoji{font-size:72px; line-height:1; margin-bottom:12px}
  .celebrate-title{font-family:Georgia,serif; font-size:26px; margin-bottom:8px; letter-spacing:-.02em}
  .celebrate-text{color:var(--muted); font-size:15px; line-height:1.5}

  /* ============ РЕАКЦИИ ============ */
  .reactions{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}
  .reaction-btn{padding:8px 14px; border-radius:12px; border:1px solid var(--line);

function getSeason(){
  const d = new Date();
  const m = d.getMonth() + 1;
  const day = d.getDate();

  if (m === 10 && day >= 25) return 'halloween';
  if (m === 12 && day >= 20) return 'newyear';
  if (m === 1 && day <= 10) return 'newyear';
  if (m === 11 || (m === 12 && day < 20) || m === 1 || m === 2) return 'winter';
  if (m >= 3 && m <= 5) return 'spring';

}

function compressImage(file, maxSide=1000, quality=0.6){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let {width,height} = img;
        if (width > height && width > maxSide) { height = Math.round(height*maxSide/width); width = maxSide; }
        else if (height > maxSide) { width = Math.round(width*maxSide/height); height = maxSide; }
        const c = document.createElement('canvas'); c.width=width; c.height=height;
        c.getContext('2d').drawImage(img,0,0,width,height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dayKey(d){ const dt = d ? new Date(d) : new Date(); return dt.toISOString().slice(0,10); }

function calcStreak(studentId){
  const mySubs = state.subs.filter(s=>s.studentId===studentId).map(s=>dayKey(s.at));
  const myFree = state.freesubs.filter(s=>s.studentId===studentId).map(s=>dayKey(s.at));
  const myChk  = (state.checkins||[]).filter(c=>c.studentId===studentId).map(c=>dayKey(c.at));
  const days = new Set([...mySubs, ...myFree, ...myChk]);
  let streak = 0;
  let d = new Date();
  const today = dayKey(d);
  const yesterday = dayKey(new Date(Date.now() - 24*3600*1000));
  if (!days.has(today) && !days.has(yesterday)) return 0;
  for (let i=0; i<365; i++){
    const k = dayKey(d);
    if (days.has(k)) streak++;
    else if (i>0) break;
    d.setDate(d.getDate()-1);
  }
  return streak;
}

function activeToday(studentId){
  const today = dayKey();
  const mySubs = state.subs.filter(s=>s.studentId===studentId).map(s=>dayKey(s.at));
  const myFree = state.freesubs.filter(s=>s.studentId===studentId).map(s=>dayKey(s.at));
  const myChk  = (state.checkins||[]).filter(c=>c.studentId===studentId).map(c=>dayKey(c.at));
  return mySubs.includes(today) || myFree.includes(today) || myChk.includes(today);
}

  if (ui.openTask || ui.newFree || ui.newCheckin || ui.showProgress) return;
  const all = [
    ...state.subs.filter(s=>s.studentId===me.id).map(s=>({...s, kind:'task'})),
    ...state.freesubs.filter(s=>s.studentId===me.id).map(s=>({...s, kind:'free'}))
  ].filter(s=>s.score!=null);
  const recent = all.filter(s=>{
    const t = new Date(s.checkedAt||s.at).getTime();
    return Date.now() - t < 24*3600*1000 && Number(s.score) >= 5;
  }).sort((a,b)=>(b.checkedAt||b.at).localeCompare(a.checkedAt||a.at));
  if (recent.length){
    const key = recent[0].id;
    if (!celebratedNow.has(key)){
      celebratedNow.add(key);
      setTimeout(()=>{ showConfetti(); }, 400);
    }
  }
}

function isUrgent(sub){
  if (sub.score != null) return false;
  const hours = (Date.now() - new Date(sub.at).getTime()) / (1000*60*60);
  return hours > 48;
}

function tabCheck(){
  let items = [];
  state.subs.forEach(s => items.push({ kind:'task', ...s }));
  state.freesubs.forEach(s => items.push({ kind:'free', ...s }));
  items.sort((a,b)=>{
    const ua = isUrgent(a) ? 1 : 0;
    const ub = isUrgent(b) ? 1 : 0;
    if (ua !== ub) return ub - ua;
    return (b.at||'').localeCompare(a.at||'');
  });
  if (ui.filter==='pending') items = items.filter(s=>s.score==null);
  if (ui.filter==='done')    items = items.filter(s=>s.score!=null);

  const pendingCount = countPending();
  const urgentCount = [...state.subs, ...state.freesubs].filter(isUrgent).length;
  const pill = (k,l) => `<button class="pill ${ui.filter===k?'active':''}" data-act="set-filter" data-filter="${k}">${l}</button>`;
  const urgentBanner = (ui.filter !== 'done' && urgentCount > 0) ? `
    <div class="notif-banner" style="background:linear-gradient(135deg,#FFF1EE 0%,#FCE0D9 100%);border-color:#F0B8AA">
      <div class="notif-banner-icon">🚨</div>
      <div class="notif-banner-text" style="color:#8B2C1A">
        <b>${urgentCount}</b> ${urgentCount===1?'работа ждёт':'работ ждут'} проверки больше 2 дней — они сверху.
      </div>
    </div>` : '';

  return `<div class="pills">
    ${pill('pending','Ждут проверки' + (pendingCount?` (${pendingCount})`:''))}
    ${pill('done','Проверенные')}
    ${pill('all','Все')}
  </div>
  ${urgentBanner}
  ${items.length ? items.map(subCard).join('') : `<div class="empty">Здесь пусто. Ура 🎉</div>`}`;
}
function subCard(s){
  let topic, max, kind, id, photos;
  if (s.kind==='task'){
    const a = state.tasks.find(t=>t.id===s.taskId); if (!a) return '';
    topic = a.topic||'Задание'; max = a.max||3; kind = a.type; id = s.id;
    photos = s.images||[];
  } else {
    topic = s.topic||'Свободная работа'; max = s.max||6; kind = s.type||'Свободная сдача'; id = s.id;
    photos = s.images||[];
  }
  const st = state.students.find(x=>x.id===s.studentId);
  const urgent = isUrgent(s);
  const avatar = st?.avatar || '🦊';
  return `<div class="task ${urgent?'urgent':''}" data-act="open-check" data-id="${id}" data-kind="${s.kind}">
    <div class="task-head">
      <div style="min-width:0">
        <div class="badges">
          ${s.score!=null ? `<span class="badge ok">Проверено</span>` :
            urgent ? `<span class="badge urgent">🚨 Срочно</span>` :
            `<span class="badge">Ждёт проверки</span>`}
          ${s.kind==='free' ? `<span class="badge neutral">Свободная</span>` : ''}
          <span class="badge neutral">${esc(kind)}</span>
        </div>
        <h3 class="h3">${esc(topic)}</h3>
        <div class="meta">${avatar} ${esc(st?st.name:'—')} · ${fmtRel(s.at)}${photos.length?` · 📎 ${photos.length}`:''}</div>
      </div>
      <div class="score">${s.score!=null?`${s.score} / ${max}`:'—'}</div>
    </div>
  </div>`;
}

      <button class="btn btn-ghost" data-act="save-check" data-id="${s.id}" data-kind="${kind}" data-next="0">Сохранить</button>

function viewStudent(me){
  if (ui.newCheckin) return viewCheckinForm(me);
  if (ui.showProgress) return viewStudentProgress(me);
  if (ui.newFree) return viewStudentFreeForm(me);
  if (ui.openTask) return viewStudentTask(me);

  const tasks = state.tasks.filter(t=>t.studentId==='all'||t.studentId===me.id)
    .sort((a,b)=>(a.due||'z').localeCompare(b.due||'z'));
  const mySubs = state.subs.filter(s=>s.studentId===me.id);
  const myFree = state.freesubs.filter(s=>s.studentId===me.id);
  const all = [...mySubs, ...myFree];
  const checked = all.filter(s=>s.score!=null);
  const avg = checked.length ? (checked.reduce((a,b)=>a+Number(b.score),0)/checked.length).toFixed(1) : '—';

  const streak = calcStreak(me.id);
  const today = activeToday(me.id);
  const lvl = getLevel(streak);
  const phrase = getMotivationPhrase();

  // Прогресс до следующего уровня
  let progressText = 'Максимальный уровень 💎';
  let progressPct = 100;
  if (lvl.next){
    const span = lvl.next - lvl.prev;
    const done = streak - lvl.prev;
    progressPct = Math.min(100, Math.round((done/span)*100));
    const left = lvl.next - streak;
    progressText = `До «${getNextLevelName(streak)}» — ${left} ${pluralDays(left)}`;
  }

  const myCheckins = (state.checkins||[]).filter(c=>c.studentId===me.id)
    .sort((a,b)=>(b.at||'').localeCompare(a.at||'')).slice(0, 8);

  return `${studentTopbar(me)}<div class="container"><div class="page">

    <div class="hero-card lv-${lvl.lv}">
      <div class="hero-header">
        <div class="hero-streak">
          <div class="hero-emoji">${lvl.emoji}</div>
          <div class="hero-info">
            <div class="hero-num">${streak} <span>${pluralDays(streak)}</span></div>
            <div class="hero-lvl">${lvl.name} подряд</div>
          </div>
        </div>
        <div class="hero-today">
          ${today
            ? `<div class="today-chip">✓ Сегодня</div>`
            : `<button class="btn" data-act="open-checkin">Отметиться</button>`}
        </div>
      </div>
      <div class="hero-progress">
        <div class="hero-progress-text">${progressText}</div>
        <div class="hero-progress-bar"><div style="width:${progressPct}%"></div></div>
      </div>
      <div class="hero-quote">«${esc(phrase)}»</div>
    </div>

    <div class="actions-row">
      <button class="action-tile primary" data-act="open-free">
        <span class="ico">📝</span>
        <span class="lbl">Сдать<br>работу</span>
      </button>
      <button class="action-tile" data-act="open-checkin">
        <span class="ico">🔥</span>
        <span class="lbl">Отме-<br>титься</span>
      </button>
      <button class="action-tile" data-act="open-progress">
        <span class="ico">📊</span>
        <span class="lbl">Мой<br>прогресс</span>
      </button>
    </div>

    <div class="stats-inline">
      <div class="item"><span class="n">${tasks.length}</span><span class="l">Заданий</span></div>
      <div class="item"><span class="n">${all.length}</span><span class="l">Сдано</span></div>
      <div class="item"><span class="n">${checked.length}</span><span class="l">Проверено</span></div>
      <div class="item"><span class="n">${avg}</span><span class="l">Средний</span></div>
    </div>

    <h2 class="section-title">
      <span>Мои задания</span>
      ${tasks.length ? `<span class="count">${tasks.length}</span>` : ''}
    </h2>
    ${tasks.length ? tasks.map(a=>studentTaskCard(a,me)).join('')
      : `<div class="empty">Заданий пока нет. Отдыхай 🌿</div>`}

    ${myFree.length ? `
      <h2 class="section-title">
        <span>Свободные работы</span>
        <span class="count">${myFree.length}</span>
      </h2>
      ${myFree.map(f=>freeStudentCard(f)).join('')}
    ` : ''}

    ${myCheckins.length ? `
      <h2 class="section-title">
        <span>Что я выучил</span>
        <span class="count">${myCheckins.length}</span>
      </h2>
      ${myCheckins.map(c=>checkinCardStudent(c)).join('')}
    ` : ''}

  </div></div>`;
}

function viewStudentProgress(me){
  const mySubs = state.subs.filter(s=>s.studentId===me.id).map(s=>{
    const a = state.tasks.find(t=>t.id===s.taskId);
    return { ...s, max: a?.max||3, type: a?.type||'', topic: a?.topic||'' };
  });
  const myFree = state.freesubs.filter(s=>s.studentId===me.id).map(s=>({
    ...s, max: s.max||6, type: s.type||'Свободная', topic: s.topic||''
  }));
  const all = [...mySubs, ...myFree].sort((a,b)=>(a.checkedAt||a.at||'').localeCompare(b.checkedAt||b.at||''));
  const checked = all.filter(s=>s.score!=null);

  const avg = checked.length ? checked.reduce((a,b)=>a+Number(b.score),0)/checked.length : 0;
  const streak = calcStreak(me.id);
  const lvl = getLevel(streak);

  const today = new Date(); today.setHours(0,0,0,0);
  const activity = [];
  for (let i=27; i>=0; i--){
    const day = new Date(today); day.setDate(day.getDate()-i);
    const key = day.toISOString().slice(0,10);
    const subsCnt = all.filter(s=>new Date(s.at).toISOString().slice(0,10)===key).length;
    const chkCnt = (state.checkins||[]).filter(c=>c.studentId===me.id && new Date(c.at).toISOString().slice(0,10)===key).length;
    activity.push({ key, cnt: subsCnt + chkCnt });
  }
  const maxCnt = Math.max(1, ...activity.map(a=>a.cnt));
  const activityHTML = activity.map(a=>{
    const op = a.cnt===0 ? 0.08 : 0.2 + 0.8*(a.cnt/maxCnt);
    return `<div style="width:100%;aspect-ratio:1;background:rgba(193,78,49,${op});border-radius:3px"
      title="${a.key}: ${a.cnt}"></div>`;
  }).join('');

  const W = 320, H = 160, P = 28;
  let chart = `<div class="empty">Пока нет проверенных работ — график появится позже.</div>`;
  if (checked.length >= 2){
    const maxScore = Math.max(...checked.map(s=>Number(s.score)), 1);
    const pts = checked.map((s,i)=>{
      const x = P + (W-2*P) * (i/(checked.length-1));
      const y = H-P - (H-2*P) * (Number(s.score)/maxScore);
      return { x, y, s };
    });
    const line = pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4"
      fill="#C14E31" stroke="#fff" stroke-width="2"><title>${esc(p.s.topic||'')}: ${p.s.score}/${p.s.max}</title></circle>`).join('');
    const yTicks = [0, Math.round(maxScore/2), maxScore].map(v=>{
      const y = H-P - (H-2*P) * (v/maxScore);
      return `<text x="4" y="${y+4}" font-size="10" fill="#6B6459">${v}</text>
        <line x1="${P}" y1="${y}" x2="${W-P}" y2="${y}" stroke="#E2DCD1" stroke-width="1"/>`;
    }).join('');
    chart = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${yTicks}
      <path d="${line}" fill="none" stroke="#14110F" stroke-width="2" stroke-linejoin="round"/>
      ${dots}
    </svg>`;
  } else if (checked.length === 1){
    chart = `<div class="answer" style="text-align:center">
      Первая оценка: <b>${checked[0].score}/${checked[0].max}</b>
    </div>`;
  }

  const byType = {};
  checked.forEach(s=>{
    const t = s.type || 'Другое';
    if (!byType[t]) byType[t] = { sum:0, n:0 };
    byType[t].sum += Number(s.score);
    byType[t].n++;
  });
  const typeRows = Object.entries(byType).map(([t,v])=>
    `<div class="meta" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">
      <span>${esc(t)}</span><span><b>${(v.sum/v.n).toFixed(1)}</b> средний · ${v.n} шт</span>
    </div>`).join('');

  return `${studentTopbar(me)}<div class="container"><div class="page">
    <button class="btn btn-ghost btn-sm" data-act="close-progress">← Назад</button>
    <h1 class="display h1" style="margin:16px 0 6px">Прогресс</h1>
    <p class="meta" style="margin-bottom:20px">${esc(me.name)} · всего сдано ${all.length} · проверено ${checked.length}</p>

    <div class="stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat"><div class="n">${avg.toFixed(1)}</div><div class="l">Средний балл</div></div>
      <div class="stat"><div class="n">${streak}${lvl.emoji}</div><div class="l">${lvl.name}</div></div>
      <div class="stat"><div class="n">${checked.length}/${all.length}</div><div class="l">Проверено / сдано</div></div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <h2 class="h2">Динамика баллов</h2>
      ${chart}
    </div>

    <div class="card" style="margin-bottom:16px">
      <h2 class="h2">Активность за 28 дней</h2>
      <div style="display:grid;grid-template-columns:repeat(14,1fr);gap:4px">${activityHTML}</div>
      <p class="meta" style="margin-top:10px;font-size:12px">Чем темнее квадрат — тем больше активности.</p>
    </div>

    ${typeRows ? `<div class="card">
      <h2 class="h2">По типам работ</h2>
      ${typeRows}
    </div>` : ''}
  </div></div>`;
}

  session = { role:'student', id: st.id };
  localStorage.setItem(LS_SES, JSON.stringify(session));
  ui.openTask = null; ui.newFree = false; ui.tempPhotos = []; ui.showProgress = false; ui.newCheckin = false;
  render();
}
function addStudent(){
  const name = $('nName').value.trim();
  if (!name) return toast('Введи имя');
  let pin = $('nPin').value.trim() || String(Math.floor(1000+Math.random()*9000));
  const EMOJIS = ['🦊','🐼','🦁','🌸','⚡','🌙','🐨','🦉','🐧','🦄','🐯','🍀','⭐','🔥','🎯','🌊'];
  const avatar = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  state.students.push({ id:uid(), name, pin, avatar });
  save();
}
function delStudent(id){
  if (!confirm('Удалить ученика вместе с его работами?')) return;
  state.students = state.students.filter(s=>s.id!==id);
  state.subs = state.subs.filter(s=>s.studentId!==id);
  state.freesubs = state.freesubs.filter(s=>s.studentId!==id);
  state.checkins = (state.checkins||[]).filter(s=>s.studentId!==id);
  save();
}
function addTask(){
  const topic = $('tTopic').value.trim();
  const text  = $('tText').value.trim();
  if (!topic && !text) return toast('Заполни тему или текст');
  state.tasks.push({
    id:uid(), studentId:$('tWho').value, no:$('tNo').value||'',
    type:$('tType').value, max:Number($('tMax').value)||3,
    topic, text, link:$('tLink').value.trim(), due:$('tDue').value,
    at:new Date().toISOString()
  });
  save(); toast('Задание выдано');
}
function delTask(id){
  if (!confirm('Удалить задание?')) return;
  state.tasks = state.tasks.filter(t=>t.id!==id);
  state.subs = state.subs.filter(s=>s.taskId!==id);
  save();
}

function addSubmissionCheckin(studentId, topic, kind, taskType){
  state.checkins = state.checkins || [];
  const prefix = kind==='free' ? 'Сдал(а) свободную работу' : 'Сдал(а) задание';
  const text = `${prefix}: ${topic}${taskType ? ' ('+taskType+')' : ''}`;
  state.checkins.push({
    id: uid(), studentId, text, kind: 'submission',
    at: new Date().toISOString(), likedByCurator: false
  });
}

function submitWork(taskId){
  const text = $('sText').value.trim();
  const link = $('sLink').value.trim();
  const images = ui.tempPhotos.slice();
  if (!text && !link && !images.length) return toast('Напиши ответ или прикрепи фото');

  const sid = session.id;
  const a = state.tasks.find(t=>t.id===taskId);
  const obj = { id: taskId+'_'+sid, taskId, studentId:sid, text, link, images,
                at:new Date().toISOString(), score:null, feedback:'' };
  const ex = state.subs.find(s=>s.id===obj.id);
  if (ex) Object.assign(ex, obj); else state.subs.push(obj);

  if (!ex && a) addSubmissionCheckin(sid, a.topic||'Задание', 'task', a.type);

  const me = state.students.find(s=>s.id===sid);
  const taskLabel = a?.topic || 'задание';
  const taskType = a?.type ? ` (${a.type})` : '';
  sendTelegram(`📝 <b>Новая работа</b>\n${me?.name || 'Ученик'} — ${taskLabel}${taskType}`);

  ui.openTask = null; ui.tempPhotos = [];
  save();
  toast('Работа отправлена 🔥');
  checkMilestones(sid);
}
function submitFree(){
  const topic = $('fTopic').value.trim();
  const text  = $('fText').value.trim();
  const link  = $('fLink').value.trim();
  const type  = $('fType').value;
  const images = ui.tempPhotos.slice();
  if (!topic) return toast('Впиши тему работы');
  if (!text && !link && !images.length) return toast('Добавь текст, ссылку или фото');

  state.freesubs.push({
    id: uid(), studentId: session.id, topic, type, text, link, images,
    max: Number($('fMax').value) || 6,
    at: new Date().toISOString(), score: null, feedback: ''
  });
  addSubmissionCheckin(session.id, topic, 'free', type);

  const me = state.students.find(s=>s.id===session.id);
  sendTelegram(`📝 <b>Свободная работа</b>\n${me?.name || 'Ученик'} — ${topic} (${type})`);

  ui.newFree = false; ui.tempPhotos = [];
  save();
  toast('Работа отправлена 🔥');
  checkMilestones(session.id);
}

function submitCheckin(){
  const text = $('chText').value.trim();
  if (!text) return toast('Напиши пару слов о том, что выучил');
  state.checkins = state.checkins || [];
  state.checkins.push({
    id: uid(), studentId: session.id, text, kind: 'study',
    at: new Date().toISOString(), likedByCurator: false
  });
  ui.newCheckin = false;
  save(); toast('Отметился! 🔥');
}

function likeCheckin(id){
  const c = (state.checkins||[]).find(x=>x.id===id);
  if (!c) return;
  c.likedByCurator = !c.likedByCurator;
  save();
  toast(c.likedByCurator ? 'Лайк отправлен ❤️' : 'Лайк убран');
}

function saveCheck(id, kind, next){
  let s;
  if (kind==='free') s = state.freesubs.find(x=>x.id===id);
  else s = state.subs.find(x=>x.id===id);
  if (!s) return;
  const raw = $('cScore').value.trim();
  if (raw==='') return toast('Поставь балл');

  s.score = Number(raw);
  s.feedback = $('cFb').value.trim();
  s.checkedAt = new Date().toISOString();

  if (ui.checkReaction !== null && ui.checkReaction !== undefined){
    s.reaction = ui.checkReaction || null;
  }
  ui.checkReaction = null;

  if (next){
    const allPending = [
      ...state.subs.filter(x=>x.score==null && x.id !== id).map(x=>({id:x.id, kind:'task', at:x.at})),
      ...state.freesubs.filter(x=>x.score==null && x.id !== id).map(x=>({id:x.id, kind:'free', at:x.at}))
    ].sort((a,b)=>{
      const ua = isUrgent(a) ? 1 : 0;
      const ub = isUrgent(b) ? 1 : 0;
      if (ua !== ub) return ub - ua;
      return (b.at||'').localeCompare(a.at||'');
    });
    if (allPending.length){
      ui.openCheck = allPending[0].id;
      ui.openFree = allPending[0].kind;
      ui.checkReaction = null;
      save();
      toast('Сохранено, следующая →');
      return;
    }
  }
  ui.openCheck = null;
  save(); toast('Проверка сохранена');
}
function savePin(){
  const pin = $('newPin').value.trim();
  if (!pin) return toast('PIN не может быть пустым');
  state.curatorPin = pin; save(); toast('PIN обновлён');
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tezis-backup-'+todayStr()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function resetAll(){
  if (!confirm('Стереть ВСЕ данные?')) return;
  state = blank(); save(); toast('Данные стёрты');
}

function openAvatarPicker(){
  const me = state.students.find(s=>s.id===session.id);
  if (!me) return;
  const EMOJIS = ['🦊','🐼','🦁','🌸','⚡','🌙','🐨','🦉','🐧','🦄','🐯','🍀','⭐','🔥','🎯','🌊'];
  const div = document.createElement('div');
  div.className = 'celebrate';
  div.innerHTML = `
    <div class="celebrate-card" style="max-width:380px">
      <div class="celebrate-title" style="font-size:22px;margin-bottom:16px">Выбери аватар</div>
      <div class="avatar-picker">
        ${EMOJIS.map(e=>`<button class="avatar-opt ${me.avatar===e?'active':''}" data-emoji="${e}">${e}</button>`).join('')}
      </div>
      <button class="btn btn-ghost" style="margin-top:16px;width:100%" data-cancel="1">Закрыть</button>
    </div>`;
  div.addEventListener('click', (e)=>{
    const b = e.target.closest('.avatar-opt');
    if (b){
      me.avatar = b.dataset.emoji;
      save(); div.remove(); render();
      return;
    }
    if (e.target === div || e.target.closest('[data-cancel]')) div.remove();
  });
  document.body.appendChild(div);
}

/* ============================================================
   10. ФОТО
   ============================================================ */
function renderPhotoPreview(){
  const box = $('photoPrev');
  if (!box) return;
  box.innerHTML = ui.tempPhotos.map((p,i)=>`
    <div class="photo-thumb">
      <img src="${p}">
      <button class="rm" data-act="rm-photo" data-idx="${i}">×</button>
    </div>`).join('');
}
async function handleFileInput(e){
  const files = Array.from(e.target.files||[]).slice(0, 3 - ui.tempPhotos.length);
  if (!files.length) return;
  const label = e.target.closest('.file-btn');
  label?.classList.add('loading');
  for (const f of files){
    try { ui.tempPhotos.push(await compressImage(f)); } catch(err){ console.warn(err); }
  }
  label?.classList.remove('loading');
  renderPhotoPreview();
  e.target.value = '';
}

/* ============================================================
   11. СОБЫТИЯ
   ============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  const kind = el.dataset.kind;

  switch(act){
    case 'role': ui.role = el.dataset.role; render(); break;
    case 'login-curator': doLoginCurator(); break;
    case 'login-student': doLoginStudent(); break;
    case 'logout':
      session = null; localStorage.removeItem(LS_SES);
      ui = { role:'curator', tab:'students', openTask:null, openCheck:null, openFree:null,
             filter:'pending', newFree:false, tempPhotos:[], showProgress:false, newCheckin:false, checkReaction:null };
      updateTitle(); render(); break;
    case 'tab': ui.tab = el.dataset.tab; ui.openCheck=null; render(); break;
    case 'set-filter': ui.filter = el.dataset.filter; render(); break;
    case 'add-student': addStudent(); break;
    case 'del-student': delStudent(id); break;
    case 'add-task': addTask(); break;
    case 'del-task': delTask(id); break;
    case 'open-task': ui.openTask = id; ui.tempPhotos = []; render(); break;
    case 'open-check': ui.openCheck = id; ui.openFree = kind; ui.checkReaction = null; render(); break;
    case 'back': ui.openTask = null; ui.openCheck = null; ui.tempPhotos = []; ui.checkReaction = null; render(); break;
    case 'submit-work': submitWork(id); break;
    case 'save-check': saveCheck(id, kind, el.dataset.next==='1'); break;
    case 'save-pin': savePin(); break;
    case 'export': exportJSON(); break;
    case 'import': $('importFile').click(); break;
    case 'reset': resetAll(); break;

    case 'open-free': ui.newFree = true; ui.tempPhotos = []; render(); break;
    case 'close-free': ui.newFree = false; ui.tempPhotos = []; render(); break;
    case 'submit-free': submitFree(); break;
    case 'open-myfree': ui.openTask = id; renderStudentMyFree(); break;
    case 'open-progress': ui.showProgress = true; render(); break;
    case 'close-progress': ui.showProgress = false; render(); break;
    case 'open-avatar': openAvatarPicker(); break;

    case 'open-checkin': ui.newCheckin = true; render(); break;
    case 'close-checkin': ui.newCheckin = false; render(); break;
    case 'submit-checkin': submitCheckin(); break;
    case 'like-checkin': likeCheckin(id); render(); break;

    case 'rm-photo': ui.tempPhotos.splice(+el.dataset.idx,1); renderPhotoPreview(); break;
    case 'zoom': {
      const src = el.dataset.imgSrc || el.getAttribute('src');
      if (src) showLightbox(src);
      break;
    }
    case 'set-score': {
      const inp = $('cScore');
      if (inp) inp.value = el.dataset.val;
      document.querySelectorAll('.score-btn').forEach(b=>b.classList.remove('active'));
      el.classList.add('active');
      break;
    }
    case 'set-reaction': {
      const emoji = el.dataset.emoji;
      if (ui.checkReaction === emoji){ ui.checkReaction = null; }
      else { ui.checkReaction = emoji; }
      document.querySelectorAll('.reaction-btn').forEach(b=>b.classList.remove('active'));
      if (ui.checkReaction) el.classList.add('active');
      break;
    }
    case 'use-tpl': {
      const ta = $('cFb');
      if (ta){
        ta.value = ta.value ? (ta.value + '\n' + el.dataset.tpl) : el.dataset.tpl;
        ta.focus();
      }
      break;
    }
    case 'ask-notif': askNotifications(); break;
    case 'test-notif':
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted'){
        new Notification('ТЕЗИС', { body: 'Тестовое уведомление. Всё работает 👍' });
      }
      toast('Уведомление отправлено');
      break;
    case 'test-tg':
      sendTelegram('✅ <b>ТЕЗИС</b>\nTelegram-уведомления настроены. Всё работает!');
      toast('Проверь Telegram 📱');
      break;
    case 'dismiss-notif-banner':
      notifBannerDismissed = true;
      localStorage.setItem('tezis.notifBanner', 'dismissed');
      render();
      break;
  }
});

function renderStudentMyFree(){
  const me = state.students.find(s=>s.id===session.id);
  if (!me) return;
  $('app').innerHTML = viewStudentMyFree(me);
}

function showLightbox(src){
  const div = document.createElement('div');
  div.className = 'lightbox';
  div.innerHTML = `<img src="${src}">`;
  div.addEventListener('click', ()=>div.remove());
  document.body.appendChild(div);
}

document.addEventListener('change', e => {
  if (e.target.id === 'sFile' || e.target.id === 'fFile') handleFileInput(e);
});

document.addEventListener('keydown', e => {
  if (e.key!=='Enter') return;
  if (!session && ui.role==='curator' && $('pin')) doLoginCurator();
  if (!session && ui.role==='student' && $('spin')) doLoginStudent();
});

$('importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(r.result);
      state = Object.assign(blank(), parsed);
      state.students = state.students||[]; state.tasks = state.tasks||[];
      state.subs = state.subs||[]; state.freesubs = state.freesubs||[];
      state.checkins = state.checkins||[];
      save(); toast('Данные загружены');
    } catch(err){ toast('Не получилось прочитать файл'); }
  };
  r.readAsText(file);
  e.target.value = '';
});

/* ============================================================
   СТАРТ
   ============================================================ */
applySeason();
boot();
</script>
</body>
</html>

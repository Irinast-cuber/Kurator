<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ТЕЗИС — кабинет подготовки к ЕГЭ</title>
<style>
  :root{
    --cream:#F4F0E8; --paper:#fff; --ink:#14110F; --muted:#6B6459; --line:#E2DCD1;
    --accent:#C14E31; --accent-soft:#F7E9E4; --olive:#4A5340; --ok:#3F6B4A; --blue:#3A5A78;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--cream);color:var(--ink);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .display{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.02em;line-height:1.12}
  .container{max-width:1000px;margin:0 auto;padding:0 20px}
  .muted{color:var(--muted)}
  hr.hr{border:none;border-top:1px solid var(--line);margin:24px 0}

  .topbar{position:sticky;top:0;z-index:50;background:rgba(244,240,232,.88);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1000px;margin:0 auto;padding:0 20px;height:62px;
    display:flex;align-items:center;justify-content:space-between;gap:16px}
  .logo{font-family:Georgia,serif;font-size:19px;letter-spacing:.1em;font-weight:700}
  .logo span{color:var(--accent)}
  .who{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 20px;border-radius:999px;font-size:14px;font-weight:500;font-family:inherit;
    cursor:pointer;border:1px solid transparent;transition:.18s;background:none;color:inherit;white-space:nowrap}
  .btn-primary{background:var(--ink);color:var(--cream)}
  .btn-primary:hover{background:var(--accent)}
  .btn-ghost{border-color:var(--line);color:var(--ink);background:var(--paper)}
  .btn-ghost:hover{border-color:var(--ink)}
  .btn-sm{padding:8px 15px;font-size:13px}
  .btn-danger{color:var(--accent);padding:8px 12px;font-size:13px}
  .btn-danger:hover{background:var(--accent-soft)}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding:16px 0 0;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer;
    border:1px solid transparent;background:transparent;color:var(--muted);font-family:inherit;
    white-space:nowrap;transition:.18s;display:inline-flex;align-items:center;gap:7px}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--ink);color:var(--cream)}
  .tab .cnt{background:var(--accent);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600}

  .page{padding:22px 0 80px}

  .input,.select,.textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;
    background:var(--paper);font-family:inherit;font-size:14.5px;color:var(--ink);transition:.18s;outline:none}
  .input:focus,.select:focus,.textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,17,15,.06)}
  .textarea{min-height:120px;resize:vertical;line-height:1.55}
  .label{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin-bottom:7px}
  .field{margin-bottom:15px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row-3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px}
  .h1{font-size:clamp(24px,3.6vw,34px)}
  .h2{font-size:19px;font-weight:600;margin-bottom:16px;letter-spacing:-.01em}
  .h3{font-size:16px;font-weight:600;margin-bottom:4px}

  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .badge{display:inline-flex;align-items:center;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;font-weight:600;padding:4px 10px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent)}
  .badge.neutral{background:#EDE9E1;color:var(--muted)}
  .badge.ok{background:#E3EDE5;color:var(--ok)}
  .badge.blue{background:#E4EBF1;color:var(--blue)}

  .task{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:var(--paper);
    margin-bottom:12px;transition:.18s;cursor:pointer}
  .task:hover{border-color:var(--ink);transform:translateY(-1px)}
  .task-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .meta{font-size:13px;color:var(--muted)}
  .score{font-family:Georgia,serif;font-size:20px;white-space:nowrap}

  .empty{border:1px dashed var(--line);border-radius:12px;padding:40px 24px;text-align:center;
    color:var(--muted);font-size:14.5px}

  .block-label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin:20px 0 8px}
  .block-label:first-child{margin-top:0}
  .answer{background:var(--cream);border-radius:8px;padding:14px 16px;font-size:14.5px;
    white-space:pre-wrap;word-break:break-word}
  .link{display:inline-block;margin-top:10px;font-size:14px;color:var(--accent);
    text-decoration:none;border-bottom:1px solid var(--accent-soft)}
  .link:hover{border-color:var(--accent)}
  .notice{margin-top:16px;padding:12px 16px;border-radius:8px;background:#E4EBF1;
    color:var(--blue);font-size:13.5px}
  .result{margin-top:20px;padding:20px;border-radius:10px;background:#E3EDE5;text-align:center}
  .result-score{font-family:Georgia,serif;font-size:38px;line-height:1;color:var(--ok)}
  .result-score span{font-size:18px;color:var(--muted)}
  .result-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ok);font-weight:600;margin-top:6px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .stat .n{font-family:Georgia,serif;font-size:26px;line-height:1;margin-bottom:6px}
  .stat .l{font-size:11.5px;color:var(--muted);letter-spacing:.03em}

  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);
    border-radius:16px;padding:38px 32px}
  .login-sub{color:var(--muted);font-size:14px;margin:10px 0 26px}
  .roles{display:flex;gap:6px;background:var(--cream);padding:5px;border-radius:999px;margin-bottom:24px}
  .role{flex:1;padding:10px;border-radius:999px;border:none;background:transparent;
    font-family:inherit;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:.18s}
  .role.active{background:var(--ink);color:var(--cream)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5}

  .pills{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .pill{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
    font-size:13px;font-family:inherit;color:var(--muted);cursor:pointer;transition:.18s}
  .pill:hover{border-color:var(--ink);color:var(--ink)}
  .pill.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}

  /* ---------- IMAGES ---------- */
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);transition:.18s}
  .photos img:hover{opacity:.85}
  .photo-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .photo-thumb{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;
    border:1px solid var(--line)}
  .photo-thumb img{width:100%;height:100%;object-fit:cover}
  .photo-thumb .rm{position:absolute;top:2px;right:2px;background:rgba(20,17,15,.75);color:#fff;
    border:none;width:20px;height:20px;border-radius:999px;font-size:13px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
  .file-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;
    border:1px dashed var(--line);background:var(--paper);font-size:13.5px;font-family:inherit;
    color:var(--muted);cursor:pointer;transition:.18s}
  .file-btn:hover{border-color:var(--ink);color:var(--ink)}
  .file-btn.loading{opacity:.6;cursor:wait}

  /* ---------- LIGHTBOX ---------- */
  .lightbox{position:fixed;inset:0;background:rgba(20,17,15,.92);z-index:1000;
    display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px}

  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);
    color:var(--cream);padding:12px 22px;border-radius:999px;font-size:14px;opacity:0;
    pointer-events:none;transition:.3s;z-index:999}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media(max-width:700px){
    .row,.row-3{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr 1fr}
    .card{padding:20px 18px}
    .login-card{padding:30px 22px}
    .task-head{flex-direction:column;gap:10px}
    .photos{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept="application/json" hidden>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   1. ОБЛАКО
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCe4lrLiqIEmAsAsNaZp30-rsapUYjZqhY",
  authDomain: "kurator-38649.firebaseapp.com",
  databaseURL: "https://kurator-38649-default-rtdb.firebaseio.com/",
  projectId: "kurator-38649",
  storageBucket: "kurator-38649.firebasestorage.app",
  messagingSenderId: "216821009502",
  appId: "1:216821009502:web:126b52dfdf47b13a8bf8cf"
};

const ROOT = 'tezis';
let db = null, CLOUD = false;
if (firebaseConfig.databaseURL && typeof firebase !== 'undefined') {
  try { firebase.initializeApp(firebaseConfig); db = firebase.database(); CLOUD = true; }
  catch (e) { console.warn('Firebase не подключился:', e); }
}

/* ============================================================
   2. СОСТОЯНИЕ
   ============================================================ */
const LS_DATA = 'tezis.data.v1';
const LS_SES  = 'tezis.session.v1';
const blank = () => ({ curatorPin:'1234', students:[], tasks:[], subs:[], freesubs:[] });

let state = blank();
let session = null;
let ui = { role:'curator', tab:'students', openTask:null, openCheck:null, openFree:null,
           filter:'pending', newFree:false, tempPhotos:[] };

/* ============================================================
   3. УТИЛИТЫ
   ============================================================ */
const $  = id => document.getElementById(id);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(d){ if(!d) return ''; const dt=new Date(d); if(isNaN(dt)) return d;
  return dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}); }
function fmtFull(d){ if(!d) return ''; const dt=new Date(d); if(isNaN(dt)) return d;
  return dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
const todayStr = () => new Date().toISOString().slice(0,10);
const isOverdue = a => a.due && a.due < todayStr();

let toastTimer;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

/* Сжатие фото в base64 */
function compressImage(file, maxSide=1000, quality=0.6){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let {width,height} = img;
        if (width > height && width > maxSide) { height = Math.round(height*maxSide/width); width = maxSide; }
        else if (height > maxSide) { width = Math.round(width*maxSide/height); height = maxSide; }
        const c = document.createElement('canvas'); c.width=width; c.height=height;
        c.getContext('2d').drawImage(img,0,0,width,height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   4. ХРАНЕНИЕ
   ============================================================ */
function save(){
  if (CLOUD) db.ref(ROOT).set(state).catch(e=>{console.error(e);toast('Ошибка сохранения');});
  else { localStorage.setItem(LS_DATA, JSON.stringify(state)); render(); }
}

function boot(){
  const raw = localStorage.getItem(LS_SES);
  if (raw) { try{ session = JSON.parse(raw); }catch(e){} }
  if (CLOUD){
    db.ref(ROOT).on('value', snap=>{
      const v = snap.val()||{};
      state = { curatorPin:v.curatorPin||'1234', students:v.students||[], tasks:v.tasks||[],
                subs:v.subs||[], freesubs:v.freesubs||[] };
      render();
    }, err => { console.error(err); toast('Нет доступа к базе'); });
  } else {
    const rawData = localStorage.getItem(LS_DATA);
    if (rawData){ try{ state = Object.assign(blank(), JSON.parse(rawData)); }catch(e){} }
    render();
  }
}

/* ============================================================
   5. РОУТЕР
   ============================================================ */
function render(){
  const app = $('app');
  if (!session){ app.innerHTML = viewLogin(); return; }
  if (session.role==='curator'){ app.innerHTML = viewCurator(); return; }
  const me = state.students.find(s=>s.id===session.id);
  if (!me){ session=null; localStorage.removeItem(LS_SES); app.innerHTML = viewLogin(); return; }
  app.innerHTML = viewStudent(me);
}

/* ============================================================
   6. ВХОД
   ============================================================ */
function viewLogin(){
  const isSt = ui.role==='student';
  return `<div class="login"><div class="login-card">
    <div class="logo" style="font-size:26px">Т<span>Е</span>ЗИС</div>
    <p class="login-sub">Кабинет подготовки к ЕГЭ по обществознанию</p>
    <div class="roles">
      <button class="role ${!isSt?'active':''}" data-act="role" data-role="curator">Я куратор</button>
      <button class="role ${isSt?'active':''}"  data-act="role" data-role="student">Я ученик</button>
    </div>
    ${isSt ? loginStudentHTML() : loginCuratorHTML()}
    ${CLOUD ? `<div class="hint">☁ Облачный режим — данные видны на всех устройствах.</div>`
            : `<div class="hint">Локальный режим: данные хранятся только в этом браузере.</div>`}
  </div></div>`;
}
function loginCuratorHTML(){ return `
  <div class="field"><label class="label">PIN куратора</label>
  <input class="input" id="pin" type="password" inputmode="numeric" placeholder="••••"></div>
  <button class="btn btn-primary" style="width:100%" data-act="login-curator">Войти</button>
  <div class="hint">Стандартный PIN — <b>1234</b>.</div>`; }
function loginStudentHTML(){
  if (!state.students.length) return `<div class="hint">Куратор пока не добавил учеников.</div>`;
  return `
  <div class="field"><label class="label">Кто ты</label>
    <select class="select" id="sid">${state.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
  <div class="field"><label class="label">PIN</label>
    <input class="input" id="spin" type="password" inputmode="numeric" placeholder="••••"></div>
  <button class="btn btn-primary" style="width:100%" data-act="login-student">Войти</button>`;
}

/* ============================================================
   7. КУРАТОР
   ============================================================ */
function viewCurator(){
  const pending = state.subs.filter(s=>s.score==null).length
                + state.freesubs.filter(s=>s.score==null).length;
  const tabBtn = (k,l,c) => `<button class="tab ${ui.tab===k?'active':''}" data-act="tab" data-tab="${k}">${l}${c?`<span class="cnt">${c}</span>`:''}</button>`;
  let body = '';
  if (ui.tab==='students') body = tabStudents();
  else if (ui.tab==='tasks') body = tabTasks();
  else if (ui.tab==='check') body = ui.openCheck ? viewCheckDetail() : tabCheck();
  else body = tabSettings();
  return `<div class="topbar"><div class="topbar-inner">
    <div class="logo">Т<span>Е</span>ЗИС</div>
    <div class="who"><span>Куратор</span>
    <button class="btn btn-ghost btn-sm" data-act="logout">Выйти</button></div>
  </div></div>
  <div class="container">
    <div class="tabs">${tabBtn('students','Ученики')}${tabBtn('tasks','Задания')}${tabBtn('check','Проверка',pending)}${tabBtn('settings','Настройки')}</div>
    <div class="page">${body}</div>
  </div>`;
}

function tabStudents(){
  return `<div class="card" style="margin-bottom:22px">
    <h2 class="h2">Добавить ученика</h2>
    <div class="row">
      <div class="field"><label class="label">Имя</label>
        <input class="input" id="nName" placeholder="Например, Маша К."></div>
      <div class="field"><label class="label">PIN (4 цифры)</label>
        <input class="input" id="nPin" inputmode="numeric" placeholder="оставь пустым — сгенерирую"></div>
    </div>
    <button class="btn btn-primary" data-act="add-student">Добавить</button>
  </div>
  ${state.students.length ? state.students.map(studentCard).join('')
    : `<div class="empty">Пока никого нет.</div>`}`;
}
function studentCard(s){
  const tasks = state.tasks.filter(t=>t.studentId==='all'||t.studentId===s.id);
  const subs = state.subs.filter(x=>x.studentId===s.id);
  const fs   = state.freesubs.filter(x=>x.studentId===s.id);
  const all  = [...subs, ...fs].filter(x=>x.score!=null);
  const avg  = all.length ? (all.reduce((a,b)=>a+Number(b.score),0)/all.length).toFixed(1) : '—';
  return `<div class="task" style="cursor:default"><div class="task-head">
    <div><h3 class="h3">${esc(s.name)}</h3>
      <div class="meta">PIN: <b>${esc(s.pin)}</b> · заданий ${tasks.length} ·
        сдано ${subs.length+fs.length} · проверено ${all.length} · средний ${avg}</div></div>
    <button class="btn btn-danger" data-act="del-student" data-id="${s.id}">Удалить</button>
  </div></div>`;
}

function tabTasks(){
  const whoOpts = [`<option value="all">Все ученики</option>`]
    .concat(state.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`)).join('');
  return `<div class="card" style="margin-bottom:22px">
    <h2 class="h2">Новое задание</h2>
    <div class="row-3">
      <div class="field"><label class="label">Кому</label>
        <select class="select" id="tWho">${whoOpts}</select></div>
      <div class="field"><label class="label">Номер</label>
        <input class="input" id="tNo" type="number" min="1" max="25" placeholder="1–25"></div>
      <div class="field"><label class="label">Макс. балл</label>
        <input class="input" id="tMax" type="number" min="1" value="3"></div>
    </div>
    <div class="field"><label class="label">Тип</label>
      <select class="select" id="tType">
        <option>Часть 1 · краткий ответ</option>
        <option>Часть 2 · развёрнутый ответ</option>
        <option>Задание 25 · эссе</option>
        <option>План</option>
        <option>Теория / конспект</option>
      </select></div>
    <div class="field"><label class="label">Тема</label>
      <input class="input" id="tTopic" placeholder="Например: Социальная стратификация"></div>
    <div class="field"><label class="label">Текст задания</label>
      <textarea class="textarea" id="tText" placeholder="Вставь текст задания"></textarea></div>
    <div class="row">
      <div class="field"><label class="label">Ссылка на материал</label>
        <input class="input" id="tLink" placeholder="https://..."></div>
      <div class="field"><label class="label">Дедлайн</label>
        <input class="input" id="tDue" type="date"></div>
    </div>
    <button class="btn btn-primary" data-act="add-task">Выдать задание</button>
  </div>
  ${state.tasks.length ? state.tasks.slice().reverse().map(taskCardCurator).join('')
    : `<div class="empty">Заданий пока нет.</div>`}`;
}
function taskCardCurator(a){
  const who = a.studentId==='all' ? 'Все ученики'
    : (state.students.find(s=>s.id===a.studentId)?.name||'—');
  const total = a.studentId==='all' ? state.students.length : 1;
  const done = state.subs.filter(s=>s.taskId===a.id).length;
  return `<div class="task" style="cursor:default"><div class="task-head">
    <div style="min-width:0">
      <div class="badges">
        ${a.no?`<span class="badge">№ ${esc(a.no)}</span>`:''}
        <span class="badge neutral">${esc(a.type)}</span>
        ${a.due?`<span class="badge blue">до ${fmt(a.due)}</span>`:''}
      </div>

function viewStudentProgress(me){
  const mySubs = state.subs.filter(s=>s.studentId===me.id).map(s=>{
    const a = state.tasks.find(t=>t.id===s.taskId);
    return { ...s, max: a?.max||3, type: a?.type||'', topic: a?.topic||'' };
  });
  const myFree = state.freesubs.filter(s=>s.studentId===me.id).map(s=>({
    ...s, max: s.max||6, type: s.type||'Свободная', topic: s.topic||''
  }));
  const all = [...mySubs, ...myFree].sort((a,b)=>(a.checkedAt||a.at||'').localeCompare(b.checkedAt||b.at||''));
  const checked = all.filter(s=>s.score!=null);

  const avg = checked.length ? checked.reduce((a,b)=>a+Number(b.score),0)/checked.length : 0;

  // Сравнение с прошлой неделей
  const weekAgo = Date.now() - 7*24*3600*1000;
  const thisWeek = checked.filter(s=>new Date(s.checkedAt||s.at).getTime() >= weekAgo);
  const prevWeek = checked.filter(s=>{
    const t = new Date(s.checkedAt||s.at).getTime();
    return t >= weekAgo-7*24*3600*1000 && t < weekAgo;
  });
  const avgW = thisWeek.length ? thisWeek.reduce((a,b)=>a+Number(b.score),0)/thisWeek.length : 0;
  const avgP = prevWeek.length ? prevWeek.reduce((a,b)=>a+Number(b.score),0)/prevWeek.length : 0;
  const diff = avgP ? (avgW - avgP) : 0;

  // Streak — сколько дней подряд сдавал
  const days = new Set(all.map(s=>new Date(s.at).toISOString().slice(0,10)));
  let streak = 0;
  let d = new Date();
  for (let i=0; i<365; i++){
    const k = d.toISOString().slice(0,10);
    if (days.has(k)) streak++;
    else if (i>0) break;
    d.setDate(d.getDate()-1);
  }

  // Активность за 28 дней
  const today = new Date(); today.setHours(0,0,0,0);
  const activity = [];
  for (let i=27; i>=0; i--){
    const day = new Date(today); day.setDate(day.getDate()-i);
    const key = day.toISOString().slice(0,10);
    const cnt = all.filter(s=>new Date(s.at).toISOString().slice(0,10)===key).length;
    activity.push({ key, cnt, day: day.getDate() });
  }
  const maxCnt = Math.max(1, ...activity.map(a=>a.cnt));
  const activityHTML = activity.map(a=>{
    const op = a.cnt===0 ? 0.08 : 0.2 + 0.8*(a.cnt/maxCnt);
    return `<div style="width:100%;aspect-ratio:1;background:rgba(193,78,49,${op});border-radius:3px"
      title="${a.key}: ${a.cnt}"></div>`;
  }).join('');

  // График баллов
  const W = 320, H = 160, P = 28;
  let chart = `<div class="empty">Пока нет проверенных работ — график появится, когда куратор поставит первую оценку.</div>`;
  if (checked.length >= 2){
    const maxScore = Math.max(...checked.map(s=>Number(s.score)), 1);
    const pts = checked.map((s,i)=>{
      const x = P + (W-2*P) * (i/(checked.length-1));
      const y = H-P - (H-2*P) * (Number(s.score)/maxScore);
      return { x, y, s };
    });
    const line = pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4"
      fill="#C14E31" stroke="#fff" stroke-width="2"><title>${esc(p.s.topic||'')}: ${p.s.score}/${p.s.max}</title></circle>`).join('');
    const yTicks = [0, Math.round(maxScore/2), maxScore].map(v=>{
      const y = H-P - (H-2*P) * (v/maxScore);
      return `<text x="4" y="${y+4}" font-size="10" fill="#6B6459">${v}</text>
        <line x1="${P}" y1="${y}" x2="${W-P}" y2="${y}" stroke="#E2DCD1" stroke-width="1"/>`;
    }).join('');
    chart = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${yTicks}
      <path d="${line}" fill="none" stroke="#14110F" stroke-width="2" stroke-linejoin="round"/>
      ${dots}
    </svg>`;
  } else if (checked.length === 1){
    chart = `<div class="answer" style="text-align:center">
      Первая оценка: <b>${checked[0].score}/${checked[0].max}</b><br>
      <span class="muted" style="font-size:13px">Сдай ещё работу — появится график 📈</span>
    </div>`;
  }

  // Разбивка по типам
  const byType = {};
  checked.forEach(s=>{
    const t = s.type || 'Другое';
    if (!byType[t]) byType[t] = { sum:0, n:0 };
    byType[t].sum += Number(s.score);
    byType[t].n++;
  });
  const typeRows = Object.entries(byType).map(([t,v])=>
    `<div class="meta" style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">
      <span>${esc(t)}</span><span><b>${(v.sum/v.n).toFixed(1)}</b> средний · ${v.n} шт</span>
    </div>`).join('');

  return `${studentTopbar(me)}<div class="container"><div class="page">
    <button class="btn btn-ghost btn-sm" data-act="close-progress">← Назад</button>

    <h1 class="display h1" style="margin:16px 0 6px">Прогресс</h1>
    <p class="meta" style="margin-bottom:20px">${esc(me.name)} · всего сдано ${all.length} · проверено ${checked.length}</p>

    <div class="stats" style="grid-template-columns:repeat(3,1fr)">
      <div class="stat">
        <div class="n">${avg.toFixed(1)}</div>
        <div class="l">Средний балл
          ${diff!==0 ? `<span style="color:${diff>0?'var(--ok)':'var(--accent)'}">
            ${diff>0?'↑':'↓'} ${Math.abs(diff).toFixed(1)}</span>` : ''}
        </div>
      </div>
      <div class="stat">
        <div class="n">${streak}</div>
        <div class="l">Дней подряд 🔥</div>
      </div>
      <div class="stat">
        <div class="n">${checked.length}/${all.length}</div>
        <div class="l">Проверено / сдано</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px">
      <h2 class="h2">Динамика баллов</h2>
      ${chart}
    </div>

    <div class="card" style="margin-bottom:16px">
      <h2 class="h2">Активность за 28 дней</h2>
      <div style="display:grid;grid-template-columns:repeat(14,1fr);gap:4px">${activityHTML}</div>
      <p class="meta" style="margin-top:10px;font-size:12px">Чем темнее квадрат — тем больше сдач в этот день.</p>
    </div>

    ${typeRows ? `<div class="card">
      <h2 class="h2">По типам работ</h2>
      ${typeRows}
    </div>` : ''}
  </div></div>`;
                                                                                    }
}

/* ============================================================
   9. ДЕЙСТВИЯ
   ============================================================ */
function doLoginCurator(){
  const pin = $('pin').value.trim();
  if (pin !== String(state.curatorPin)) return toast('Неверный PIN');
  session = { role:'curator' };
  localStorage.setItem(LS_SES, JSON.stringify(session));
  ui.tab = 'students'; render();
}
function doLoginStudent(){
  const sid = $('sid')?.value;
  const pin = $('spin').value.trim();
  const st = state.students.find(s=>s.id===sid);
  if (!st || String(st.pin)!==pin) return toast('Неверный PIN');
  session = { role:'student', id: st.id };
  localStorage.setItem(LS_SES, JSON.stringify(session));
  ui.openTask = null; ui.newFree = false; ui.tempPhotos = [];
  render();
}
function addStudent(){
  const name = $('nName').value.trim();
  if (!name) return toast('Введи имя');
  let pin = $('nPin').value.trim() || String(Math.floor(1000+Math.random()*9000));
  state.students.push({ id:uid(), name, pin });
  save();
}
function delStudent(id){
  if (!confirm('Удалить ученика вместе с его работами?')) return;
  state.students = state.students.filter(s=>s.id!==id);
  state.subs = state.subs.filter(s=>s.studentId!==id);
  state.freesubs = state.freesubs.filter(s=>s.studentId!==id);
  save();
}
function addTask(){
  const topic = $('tTopic').value.trim();
  const text  = $('tText').value.trim();
  if (!topic && !text) return toast('Заполни тему или текст');
  state.tasks.push({
    id:uid(), studentId:$('tWho').value, no:$('tNo').value||'',
    type:$('tType').value, max:Number($('tMax').value)||3,
    topic, text, link:$('tLink').value.trim(), due:$('tDue').value,
    at:new Date().toISOString()
  });
  save(); toast('Задание выдано');
}
function delTask(id){
  if (!confirm('Удалить задание?')) return;
  state.tasks = state.tasks.filter(t=>t.id!==id);
  state.subs = state.subs.filter(s=>s.taskId!==id);
  save();
}
function submitWork(taskId){
  const text = $('sText').value.trim();
  const link = $('sLink').value.trim();
  const images = ui.tempPhotos.slice();
  if (!text && !link && !images.length) return toast('Напиши ответ или прикрепи фото');

  const sid = session.id;
  const obj = { id: taskId+'_'+sid, taskId, studentId:sid, text, link, images,
                at:new Date().toISOString(), score:null, feedback:'' };
  const ex = state.subs.find(s=>s.id===obj.id);
  if (ex) Object.assign(ex, obj); else state.subs.push(obj);
  ui.openTask = null; ui.tempPhotos = [];
  save(); toast('Работа отправлена');
}
function submitFree(){
  const topic = $('fTopic').value.trim();
  const text  = $('fText').value.trim();
  const link  = $('fLink').value.trim();
  const type  = $('fType').value;
  const images = ui.tempPhotos.slice();
  if (!topic) return toast('Впиши тему работы');
  if (!text && !link && !images.length) return toast('Добавь текст, ссылку или фото');

  state.freesubs.push({
    id: uid(), studentId: session.id, topic, type, text, link, images,
    max: Number($('fMax').value) || 6, at: new Date().toISOString(), score: null, feedback: '', at: new Date().toISOString(), score: null, feedback: ''
  });
  ui.newFree = false; ui.tempPhotos = [];
  save(); toast('Работа отправлена куратору');
}
function saveCheck(id, kind){
  let s;
  if (kind==='free') s = state.freesubs.find(x=>x.id===id);
  else s = state.subs.find(x=>x.id===id);
  if (!s) return;
  const raw = $('cScore').value.trim();
  if (raw==='') return toast('Поставь балл');
  s.score = Number(raw);
  s.feedback = $('cFb').value.trim();
  s.checkedAt = new Date().toISOString();
  ui.openCheck = null;
  save(); toast('Проверка сохранена');
}
function savePin(){
  const pin = $('newPin').value.trim();
  if (!pin) return toast('PIN не может быть пустым');
  state.curatorPin = pin; save(); toast('PIN обновлён');
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tezis-backup-'+todayStr()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function resetAll(){
  if (!confirm('Стереть ВСЕ данные?')) return;
  state = blank(); save(); toast('Данные стёрты');
}

/* ============================================================
   10. ФОТО (превью + удаление)
   ============================================================ */
function renderPhotoPreview(){
  const box = $('photoPrev');
  if (!box) return;
  box.innerHTML = ui.tempPhotos.map((p,i)=>`
    <div class="photo-thumb">
      <img src="${p}">
      <button class="rm" data-act="rm-photo" data-idx="${i}">×</button>
    </div>`).join('');
}
async function handleFileInput(e){
  const files = Array.from(e.target.files||[]).slice(0, 3 - ui.tempPhotos.length);
  if (!files.length) return;
  const label = e.target.closest('.file-btn');
  label?.classList.add('loading');
  for (const f of files){
    try { ui.tempPhotos.push(await compressImage(f)); } catch(err){ console.warn(err); }
  }
  label?.classList.remove('loading');
  renderPhotoPreview();
  e.target.value = '';
}

/* ============================================================
   11. СОБЫТИЯ
   ============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  const kind = el.dataset.kind;

  switch(act){
    case 'role': ui.role = el.dataset.role; render(); break;
    case 'login-curator': doLoginCurator(); break;
    case 'login-student': doLoginStudent(); break;
    case 'logout':
      session = null; localStorage.removeItem(LS_SES);
      ui = { role:'curator', tab:'students', openTask:null, openCheck:null, openFree:null,
             filter:'pending', newFree:false, tempPhotos:[] };
      render(); break;
    case 'tab': ui.tab = el.dataset.tab; ui.openCheck=null; render(); break;
    case 'set-filter': ui.filter = el.dataset.filter; render(); break;
    case 'add-student': addStudent(); break;
    case 'del-student': delStudent(id); break;
    case 'add-task': addTask(); break;
    case 'del-task': delTask(id); break;
    case 'open-task': ui.openTask = id; ui.tempPhotos = []; render(); break;
    case 'open-check': ui.openCheck = id; ui.openFree = kind; render(); break;
    case 'back': ui.openTask = null; ui.openCheck = null; ui.tempPhotos = []; render(); break;
    case 'submit-work': submitWork(id); break;
    case 'save-check': saveCheck(id, kind); break;
    case 'save-pin': savePin(); break;
    case 'export': exportJSON(); break;
    case 'import': $('importFile').click(); break;
    case 'reset': resetAll(); break;

    case 'open-free': ui.newFree = true; ui.tempPhotos = []; render(); break;
    case 'close-free': ui.newFree = false; ui.tempPhotos = []; render(); break;
    case 'submit-free': submitFree(); break;
    case 'open-myfree': ui.openTask = id; ui.freeView = true; renderStudentMyFree(); break;
      case 'open-progress': ui.showProgress = true; render(); break;
case 'close-progress': ui.showProgress = false; render(); break;
    case 'rm-photo': ui.tempPhotos.splice(+el.dataset.idx,1); renderPhotoPreview(); break;
    case 'zoom': {
      const src = el.dataset.imgSrc || el.getAttribute('src');
      if (src) showLightbox(src);
      break;
    }
  }
});

/* Для просмотра своей свободной работы учеником нужен особый путь */
function renderStudentMyFree(){
  const me = state.students.find(s=>s.id===session.id);
  if (!me) return;
  $('app').innerHTML = viewStudentMyFree(me);
}

function showLightbox(src){
  const div = document.createElement('div');
  div.className = 'lightbox';
  div.innerHTML = `<img src="${src}">`;
  div.addEventListener('click', ()=>div.remove());
  document.body.appendChild(div);
}

document.addEventListener('change', e => {
  if (e.target.id === 'sFile' || e.target.id === 'fFile') handleFileInput(e);
});

document.addEventListener('keydown', e => {
  if (e.key!=='Enter') return;
  if (!session && ui.role==='curator' && $('pin')) doLoginCurator();
  if (!session && ui.role==='student' && $('spin')) doLoginStudent();
});

$('importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(r.result);
      state = Object.assign(blank(), parsed);
      state.students = state.students||[]; state.tasks = state.tasks||[];
      state.subs = state.subs||[]; state.freesubs = state.freesubs||[];
      save(); toast('Данные загружены');
    } catch(err){ toast('Не получилось прочитать файл'); }
  };
  r.readAsText(file);
  e.target.value = '';
});

boot();
</script>

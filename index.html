<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ТЕЗИС — кабинет подготовки к ЕГЭ</title>
<style>
  :root{
    --cream:#F4F0E8; --paper:#fff; --ink:#14110F; --muted:#6B6459; --line:#E2DCD1;
    --accent:#C14E31; --accent-soft:#F7E9E4; --olive:#4A5340; --ok:#3F6B4A; --blue:#3A5A78;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--cream); color:var(--ink); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .display{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:-.02em;line-height:1.12}
  .container{max-width:1000px;margin:0 auto;padding:0 20px}
  .muted{color:var(--muted)}
  hr.hr{border:none;border-top:1px solid var(--line);margin:24px 0}

  /* ---------- TOPBAR ---------- */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(244,240,232,.88);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar-inner{max-width:1000px;margin:0 auto;padding:0 20px;height:62px;
    display:flex;align-items:center;justify-content:space-between;gap:16px}
  .logo{font-family:Georgia,serif;font-size:19px;letter-spacing:.1em;font-weight:700}
  .logo span{color:var(--accent)}
  .who{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}

  /* ---------- BUTTONS ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 20px;border-radius:999px;font-size:14px;font-weight:500;font-family:inherit;
    cursor:pointer;border:1px solid transparent;transition:.18s;background:none;color:inherit;white-space:nowrap}
  .btn-primary{background:var(--ink);color:var(--cream)}
  .btn-primary:hover{background:var(--accent)}
  .btn-ghost{border-color:var(--line);color:var(--ink);background:var(--paper)}
  .btn-ghost:hover{border-color:var(--ink)}
  .btn-sm{padding:8px 15px;font-size:13px}
  .btn-danger{color:var(--accent);padding:8px 12px;font-size:13px}
  .btn-danger:hover{background:var(--accent-soft)}

  /* ---------- TABS ---------- */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:16px 0 0;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer;
    border:1px solid transparent;background:transparent;color:var(--muted);font-family:inherit;
    white-space:nowrap;transition:.18s;display:inline-flex;align-items:center;gap:7px}
  .tab:hover{color:var(--ink)}
  .tab.active{background:var(--ink);color:var(--cream)}
  .tab .cnt{background:var(--accent);color:#fff;font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600}

  .page{padding:22px 0 80px}

  /* ---------- FORMS ---------- */
  .input,.select,.textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;
    background:var(--paper);font-family:inherit;font-size:14.5px;color:var(--ink);transition:.18s;outline:none}
  .input:focus,.select:focus,.textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,17,15,.06)}
  .textarea{min-height:120px;resize:vertical;line-height:1.55}
  .label{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin-bottom:7px}
  .field{margin-bottom:15px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .row-3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px}

  /* ---------- CARD ---------- */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px}
  .h1{font-size:clamp(24px,3.6vw,34px)}
  .h2{font-size:19px;font-weight:600;margin-bottom:16px;letter-spacing:-.01em}
  .h3{font-size:16px;font-weight:600;margin-bottom:4px}

  /* ---------- BADGES ---------- */
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .badge{display:inline-flex;align-items:center;font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;font-weight:600;padding:4px 10px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent)}
  .badge.neutral{background:#EDE9E1;color:var(--muted)}
  .badge.ok{background:#E3EDE5;color:var(--ok)}
  .badge.blue{background:#E4EBF1;color:var(--blue)}

  /* ---------- TASK CARD ---------- */
  .task{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:var(--paper);
    margin-bottom:12px;transition:.18s;cursor:pointer}
  .task:hover{border-color:var(--ink);transform:translateY(-1px)}
  .task-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .meta{font-size:13px;color:var(--muted)}
  .score{font-family:Georgia,serif;font-size:20px;white-space:nowrap}

  .empty{border:1px dashed var(--line);border-radius:12px;padding:40px 24px;text-align:center;
    color:var(--muted);font-size:14.5px}

  /* ---------- ANSWER BLOCKS ---------- */
  .block-label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin:20px 0 8px}
  .block-label:first-child{margin-top:0}
  .answer{background:var(--cream);border-radius:8px;padding:14px 16px;font-size:14.5px;
    white-space:pre-wrap;word-break:break-word}
  .link{display:inline-block;margin-top:10px;font-size:14px;color:var(--accent);
    text-decoration:none;border-bottom:1px solid var(--accent-soft)}
  .link:hover{border-color:var(--accent)}
  .notice{margin-top:16px;padding:12px 16px;border-radius:8px;background:#E4EBF1;
    color:var(--blue);font-size:13.5px}
  .result{margin-top:20px;padding:20px;border-radius:10px;background:#E3EDE5;text-align:center}
  .result-score{font-family:Georgia,serif;font-size:38px;line-height:1;color:var(--ok)}
  .result-score span{font-size:18px;color:var(--muted)}
  .result-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ok);font-weight:600;margin-top:6px}

  /* ---------- STATS ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .stat .n{font-family:Georgia,serif;font-size:26px;line-height:1;margin-bottom:6px}
  .stat .l{font-size:11.5px;color:var(--muted);letter-spacing:.03em}

  /* ---------- LOGIN ---------- */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);
    border-radius:16px;padding:38px 32px}
  .login-sub{color:var(--muted);font-size:14px;margin:10px 0 26px}
  .roles{display:flex;gap:6px;background:var(--cream);padding:5px;border-radius:999px;margin-bottom:24px}
  .role{flex:1;padding:10px;border-radius:999px;border:none;background:transparent;
    font-family:inherit;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:.18s}
  .role.active{background:var(--ink);color:var(--cream)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5}

  /* ---------- PILLS ---------- */
  .pills{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .pill{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
    font-size:13px;font-family:inherit;color:var(--muted);cursor:pointer;transition:.18s}
  .pill:hover{border-color:var(--ink);color:var(--ink)}
  .pill.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}

  /* ---------- TOAST ---------- */
  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);
    color:var(--cream);padding:12px 22px;border-radius:999px;font-size:14px;opacity:0;
    pointer-events:none;transition:.3s;z-index:999}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- RESPONSIVE ---------- */
  @media(max-width:700px){
    .row,.row-3{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr 1fr}
    .card{padding:20px 18px}
    .login-card{padding:30px 22px}
    .task-head{flex-direction:column;gap:10px}
  }
</style>
</head>
<body>

<div id="app"></div>
<input type="file" id="importFile" accept="application/json" hidden>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   1. ОБЛАКО (необязательно)
   Заполни — и данные будут синхронизироваться между устройствами.
   Пусто — всё работает локально в браузере.
   ============================================================ */
const firebaseConfig = {
  // apiKey:            "AIza...",
  // authDomain:        "tezis-xxxx.firebaseapp.com",
  // databaseURL:       "https://tezis-xxxx-default-rtdb.europe-west1.firebasedatabase.app",
  // projectId:         "tezis-xxxx",
  // appId:             "1:1234567890:web:abcdef"
};

const ROOT = 'tezis';
let db = null, CLOUD = false;
if (firebaseConfig.databaseURL && typeof firebase !== 'undefined') {
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    CLOUD = true;
  } catch (e) { console.warn('Firebase не подключился:', e); }
}

/* ============================================================
   2. СОСТОЯНИЕ
   ============================================================ */
const LS_DATA = 'tezis.data.v1';
const LS_SES  = 'tezis.session.v1';

const blank = () => ({ curatorPin: '1234', students: [], tasks: [], subs: [] });

let state   = blank();
let session = null;
let ui = { role: 'curator', tab: 'students', openTask: null, openCheck: null, filter: 'pending' };

/* ============================================================
   3. УТИЛИТЫ
   ============================================================ */
const $  = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function fmt(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}
function fmtFull(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
const todayStr = () => new Date().toISOString().slice(0, 10);
const isOverdue = a => a.due && a.due < todayStr();

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================================================
   4. ХРАНЕНИЕ
   ============================================================ */
function save() {
  if (CLOUD) {
    db.ref(ROOT).set(state).catch(e => { console.error(e); toast('Ошибка сохранения'); });
  } else {
    localStorage.setItem(LS_DATA, JSON.stringify(state));
    render();
  }
}

function boot() {
  const raw = localStorage.getItem(LS_SES);
  if (raw) { try { session = JSON.parse(raw); } catch (e) {} }

  if (CLOUD) {
    db.ref(ROOT).on('value', snap => {
      const v = snap.val() || {};
      state = {
        curatorPin: v.curatorPin || '1234',
        students: v.students || [],
        tasks:    v.tasks    || [],
        subs:     v.subs     || []
      };
      render();
    }, err => {
      console.error(err);
      toast('Нет доступа к базе — проверь правила Firebase');
    });
  } else {
    const rawData = localStorage.getItem(LS_DATA);
    if (rawData) { try { state = Object.assign(blank(), JSON.parse(rawData)); } catch (e) {} }
    render();
  }
}

/* ============================================================
   5. РОУТЕР
   ============================================================ */
function render() {
  const app = $('app');
  if (!session) { app.innerHTML = viewLogin(); return; }

  if (session.role === 'curator') { app.innerHTML = viewCurator(); return; }

  const me = state.students.find(s => s.id === session.id);
  if (!me) {
    session = null;
    localStorage.removeItem(LS_SES);
    app.innerHTML = viewLogin();
    return;
  }
  app.innerHTML = viewStudent(me);
}

/* ============================================================
   6. ЭКРАН ВХОДА
   ============================================================ */
function viewLogin() {
  const isStudent = ui.role === 'student';
  return `
  <div class="login">
    <div class="login-card">
      <div class="logo" style="font-size:26px">Т<span>Е</span>ЗИС</div>
      <p class="login-sub">Кабинет подготовки к ЕГЭ по обществознанию</p>

      <div class="roles">
        <button class="role ${!isStudent ? 'active' : ''}" data-act="role" data-role="curator">Я куратор</button>
        <button class="role ${isStudent ? 'active' : ''}"  data-act="role" data-role="student">Я ученик</button>
      </div>

      ${isStudent ? loginStudentHTML() : loginCuratorHTML()}

      ${CLOUD
        ? `<div class="hint">☁ Облачный режим — данные видны на всех устройствах.</div>`
        : `<div class="hint">Локальный режим: данные хранятся только в этом браузере.</div>`}
    </div>
  </div>`;
}

function loginCuratorHTML() {
  return `
    <div class="field">
      <label class="label">PIN куратора</label>
      <input class="input" id="pin" type="password" inputmode="numeric" placeholder="••••">
    </div>
    <button class="btn btn-primary" style="width:100%" data-act="login-curator">Войти</button>
    <div class="hint">Стандартный PIN — <b>1234</b>. Смени его в настройках.</div>`;
}

function loginStudentHTML() {
  if (!state.students.length) {
    return `<div class="hint">Куратор пока не добавил ни одного ученика. Попроси у него доступ.</div>`;
  }
  return `
    <div class="field">
      <label class="label">Кто ты</label>
      <select class="select" id="sid">
        ${state.students.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label class="label">PIN</label>
      <input class="input" id="spin" type="password" inputmode="numeric" placeholder="••••">
    </div>
    <button class="btn btn-primary" style="width:100%" data-act="login-student">Войти</button>`;
}

/* ============================================================
   7. КАБИНЕТ КУРАТОРА
   ============================================================ */
function viewCurator() {
  const pending = state.subs.filter(s => s.score == null).length;

  const tabBtn = (key, label, cnt) => `
    <button class="tab ${ui.tab === key ? 'active' : ''}" data-act="tab" data-tab="${key}">
      ${label}${cnt ? `<span class="cnt">${cnt}</span>` : ''}
    </button>`;

  let body = '';
  if (ui.tab === 'students') body = tabStudents();
  else if (ui.tab === 'tasks') body = tabTasks();
  else if (ui.tab === 'check') body = ui.openCheck ? viewCheckDetail() : tabCheck();
  else body = tabSettings();

  return `
  <div class="topbar"><div class="topbar-inner">
    <div class="logo">Т<span>Е</span>ЗИС</div>
    <div class="who">
      <span>Куратор</span>
      <button class="btn btn-ghost btn-sm" data-act="logout">Выйти</button>
    </div>
  </div></div>
  <div class="container">
    <div class="tabs">
      ${tabBtn('students', 'Ученики')}
      ${tabBtn('tasks', 'Задания')}
      ${tabBtn('check', 'Проверка', pending)}
      ${tabBtn('settings', 'Настройки')}
    </div>
    <div class="page">${body}</div>
  </div>`;
}

/* ---------- вкладка «Ученики» ---------- */
function tabStudents() {
  return `
  <div class="card" style="margin-bottom:22px">
    <h2 class="h2">Добавить ученика</h2>
    <div class="row">
      <div class="field">
        <label class="label">Имя</label>
        <input class="input" id="nName" placeholder="Например, Маша К.">
      </div>
      <div class="field">
        <label class="label">PIN (4 цифры)</label>
        <input class="input" id="nPin" inputmode="numeric" placeholder="оставь пустым — сгенерирую">
      </div>
    </div>
    <button class="btn btn-primary" data-act="add-student">Добавить</button>
  </div>

  ${state.students.length
    ? state.students.map(studentCard).join('')
    : `<div class="empty">Пока никого нет. Добавь ученика — он войдёт по имени и PIN.</div>`}`;
}

function studentCard(s) {
  const tasks   = state.tasks.filter(t => t.studentId === 'all' || t.studentId === s.id);
  const subs    = state.subs.filter(x => x.studentId === s.id);
  const checked = subs.filter(x => x.score != null);
  const avg     = checked.length
    ? (checked.reduce((a, b) => a + Number(b.score), 0) / checked.length).toFixed(1)
    : '—';

  return `
  <div class="task" style="cursor:default">
    <div class="task-head">
      <div>
        <h3 class="h3">${esc(s.name)}</h3>
        <div class="meta">
          PIN: <b>${esc(s.pin)}</b> · заданий ${tasks.length} ·
          сдано ${subs.length} · проверено ${checked.length} · средний балл ${avg}
        </div>
      </div>
      <button class="btn btn-danger" data-act="del-student" data-id="${s.id}">Удалить</button>
    </div>
  </div>`;
}

/* ---------- вкладка «Задания» ---------- */
function tabTasks() {
  const whoOpts = [`<option value="all">Все ученики</option>`]
    .concat(state.students.map(s => `<option value="${s.id}">${esc(s.name)}</option>`))
    .join('');

  return `
  <div class="card" style="margin-bottom:22px">
    <h2 class="h2">Новое задание</h2>

    <div class="row-3">
      <div class="field">
        <label class="label">Кому</label>
        <select class="select" id="tWho">${whoOpts}</select>
      </div>
      <div class="field">
        <label class="label">Номер задания</label>
        <input class="input" id="tNo" type="number" min="1" max="25" placeholder="1–25">
      </div>
      <div class="field">
        <label class="label">Макс. балл</label>
        <input class="input" id="tMax" type="number" min="1" value="3">
      </div>
    </div>

    <div class="field">
      <label class="label">Тип</label>
      <select class="select" id="tType">
        <option>Часть 1 · краткий ответ</option>
        <option>Часть 2 · развёрнутый ответ</option>
        <option>Задание 25 · эссе</option>
        <option>План</option>
        <option>Теория / конспект</option>
      </select>
    </div>

    <div class="field">
      <label class="label">Тема</label>
      <input class="input" id="tTopic" placeholder="Например: Социальная стратификация">
    </div>

    <div class="field">
      <label class="label">Текст задания</label>
      <textarea class="textarea" id="tText" placeholder="Вставь текст задания или свой вопрос"></textarea>
    </div>

    <div class="row">
      <div class="field">
        <label class="label">Ссылка на материал</label>
        <input class="input" id="tLink" placeholder="https://...">
      </div>
      <div class="field">
        <label class="label">Дедлайн</label>
        <input class="input" id="tDue" type="date">
      </div>
    </div>

    <button class="btn btn-primary" data-act="add-task">Выдать задание</button>
  </div>

  ${state.tasks.length
    ? state.tasks.slice().reverse().map(taskCardCurator).join('')
    : `<div class="empty">Заданий пока нет.</div>`}`;
}

function taskCardCurator(a) {
  const who = a.studentId === 'all'
    ? 'Все ученики'
    : (state.students.find(s => s.id === a.studentId)?.name || '—');
  const total = a.studentId === 'all' ? state.students.length : 1;
  const done  = state.subs.filter(s => s.taskId === a.id).length;

  return `
  <div class="task" style="cursor:default">
    <div class="task-head">
      <div style="min-width:0">
        <div class="badges">
          ${a.no ? `<span class="badge">№ ${esc(a.no)}</span>` : ''}
          <span class="badge neutral">${esc(a.type)}</span>
          ${a.due ? `<span class="badge blue">до ${fmt(a.due)}</span>` : ''}
        </div>
        <h3 class="h3">${esc(a.topic || 'Без темы')}</h3>
        ${a.text ? `<div class="meta" style="margin-top:6px">${esc(a.text).slice(0, 220)}${a.text.length > 220 ? '…' : ''}</div>` : ''}
        <div class="meta" style="margin-top:8px">${esc(who)} · сдали ${done} из ${total}</div>
      </div>
      <button class="btn btn-danger" data-act="del-task" data-id="${a.id}">Удалить</button>
    </div>
  </div>`;
}

/* ---------- вкладка «Проверка» ---------- */
function tabCheck() {
  let subs = state.subs.slice().sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  if (ui.filter === 'pending') subs = subs.filter(s => s.score == null);
  if (ui.filter === 'done')    subs = subs.filter(s => s.score != null);

  const pill = (key, label) =>
    `<button class="pill ${ui.filter === key ? 'active' : ''}" data-act="set-filter" data-filter="${key}">${label}</button>`;

  return `
    <div class="pills">
      ${pill('pending', 'Ждут проверки')}
      ${pill('done', 'Проверенные')}
      ${pill('all', 'Все')}
    </div>
    ${subs.length ? subs.map(subCard).join('') : `<div class="empty">Здесь пусто.</div>`}`;
}

function subCard(s) {
  const a  = state.tasks.find(t => t.id === s.taskId);
  const st = state.students.find(x => x.id === s.studentId);
  if (!a) return '';

  return `
  <div class="task" data-act="open-check" data-id="${s.id}">
    <div class="task-head">
      <div style="min-width:0">
        <div class="badges">
          ${s.score != null
            ? `<span class="badge ok">Проверено</span>`
            : `<span class="badge">Ждёт проверки</span>`}
          ${a.no ? `<span class="badge neutral">№ ${esc(a.no)}</span>` : ''}
        </div>
        <h3 class="h3">${esc(a.topic || 'Задание')}</h3>
        <div class="meta">${esc(st ? st.name : '—')} · сдано ${fmtFull(s.at)}</div>
      </div>
      <div class="score">${s.score != null ? `${s.score} / ${a.max || 3}` : '—'}</div>
    </div>
  </div>`;
}

function viewCheckDetail() {
  const s = state.subs.find(x => x.id === ui.openCheck);
  if (!s) { ui.openCheck = null; return tabCheck(); }
  const a  = state.tasks.find(t => t.id === s.taskId);
  const st = state.students.find(x => x.id === s.studentId);

  return `
    <button class="btn btn-ghost btn-sm" data-act="back">← К списку</button>

    <div class="card" style="margin-top:16px">
      <div class="badges">
        ${a?.no ? `<span class="badge">№ ${esc(a.no)}</span>` : ''}
        <span class="badge neutral">${esc(a?.type || '')}</span>
      </div>
      <h1 class="display h1" style="margin:10px 0 6px">${esc(a?.topic || 'Задание')}</h1>
      <div class="meta">${esc(st ? st.name : '—')} · сдано ${fmtFull(s.at)}</div>

      <div class="block-label">Текст задания</div>
      <div class="answer">${esc(a?.text || '—')}</div>

      <div class="block-label">Ответ ученика</div>
      <div class="answer">${esc(s.text) || '<span class="muted">— только ссылка —</span>'}</div>
      ${s.link ? `<a class="link" href="${esc(s.link)}" target="_blank" rel="noopener">Прикреплённая ссылка →</a>` : ''}

      <hr class="hr">

      <div class="row">
        <div class="field">
          <label class="label">Балл (из ${a?.max || 3})</label>
          <input class="input" id="cScore" type="number" min="0" value="${s.score ?? ''}" placeholder="0">
        </div>
      </div>
      <div class="field">
        <label class="label">Комментарий ученику</label>
        <textarea class="textarea" id="cFb" placeholder="Что получилось, что поправить...">${esc(s.feedback || '')}</textarea>
      </div>

      <button class="btn btn-primary" data-act="save-check" data-id="${s.id}">Сохранить проверку</button>
    </div>`;
}

/* ---------- вкладка «Настройки» ---------- */
function tabSettings() {
  return `
  <div class="card" style="margin-bottom:18px">
    <h2 class="h2">PIN куратора</h2>
    <div class="field" style="max-width:240px">
      <label class="label">Новый PIN</label>
      <input class="input" id="newPin" inputmode="numeric" value="${esc(state.curatorPin)}">
    </div>
    <button class="btn btn-primary" data-act="save-pin">Сохранить</button>
  </div>

  <div class="card" style="margin-bottom:18px">
    <h2 class="h2">Резервная копия</h2>
    <p class="meta" style="margin-bottom:16px">Выгрузи все данные в файл или загрузи обратно.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-ghost" data-act="export">Скачать JSON</button>
      <button class="btn btn-ghost" data-act="import">Загрузить JSON</button>
    </div>
  </div>

  <div class="card">
    <h2 class="h2">Режим работы</h2>
    <p class="meta" style="margin-bottom:14px">
      ${CLOUD
        ? '☁ <b>Облако.</b> Данные синхронизируются между всеми устройствами.'
        : '💾 <b>Локально.</b> Данные хранятся только в этом браузере. Чтобы ученики видели задания на своих устройствах — подключи Firebase (инструкция в коде, блок «1. ОБЛАКО»).'}
    </p>
    <button class="btn btn-danger" data-act="reset" style="border:1px solid var(--line)">Стереть все данные</button>
  </div>`;
}

/* ============================================================
   8. КАБИНЕТ УЧЕНИКА
   ============================================================ */
function studentTopbar(me) {
  return `
  <div class="topbar"><div class="topbar-inner">
    <div class="logo">Т<span>Е</span>ЗИС</div>
    <div class="who">
      <span>${esc(me.name)}</span>
      <button class="btn btn-ghost btn-sm" data-act="logout">Выйти</button>
    </div>
  </div></div>`;
}

function viewStudent(me) {
  if (ui.openTask) return viewStudentTask(me);

  const tasks = state.tasks
    .filter(t => t.studentId === 'all' || t.studentId === me.id)
    .sort((a, b) => (a.due || 'z').localeCompare(b.due || 'z'));

  const mySubs  = state.subs.filter(s => s.studentId === me.id);
  const checked = mySubs.filter(s => s.score != null);
  const avg = checked.length
    ? (checked.reduce((a, b) => a + Number(b.score), 0) / checked.length).toFixed(1)
    : '—';

  return `
  ${studentTopbar(me)}
  <div class="container">
    <div class="page">
      <div class="stats">
        <div class="stat"><div class="n">${tasks.length}</div><div class="l">Всего заданий</div></div>
        <div class="stat"><div class="n">${mySubs.length}</div><div class="l">Сдано</div></div>
        <div class="stat"><div class="n">${checked.length}</div><div class="l">Проверено</div></div>
        <div class="stat"><div class="n">${avg}</div><div class="l">Средний балл</div></div>
      </div>

      <h2 class="h2">Мои задания</h2>
      ${tasks.length
        ? tasks.map(a => studentTaskCard(a, me)).join('')
        : `<div class="empty">Заданий пока нет. Отдыхай 🌿</div>`}
    </div>
  </div>`;
}

function studentTaskCard(a, me) {
  const sub = state.subs.find(s => s.taskId === a.id && s.studentId === me.id);
  let badge;

  if (!sub) {
    badge = isOverdue(a)
      ? `<span class="badge" style="background:#F7E4E0;color:var(--accent)">Просрочено</span>`
      : `<span class="badge neutral">Новое</span>`;
  } else if (sub.score == null) {
    badge = `<span class="badge blue">На проверке</span>`;
  } else {
    badge = `<span class="badge ok">Проверено · ${sub.score}/${a.max || 3}</span>`;
  }

  return `
  <div class="task" data-act="open-task" data-id="${a.id}">
    <div class="task-head">
      <div style="min-width:0">
        <div class="badges">
          ${badge}
          ${a.no ? `<span class="badge neutral">№ ${esc(a.no)}</span>` : ''}
          ${a.due ? `<span class="badge blue">до ${fmt(a.due)}</span>` : ''}
        </div>
        <h3 class="h3">${esc(a.topic || 'Задание')}</h3>
        <div class="meta">${esc(a.type)}</div>
      </div>
    </div>
  </div>`;
}

function viewStudentTask(me) {
  const a = state.tasks.find(t => t.id === ui.openTask);
  if (!a) { ui.openTask = null; return viewStudent(me); }

  const sub = state.subs.find(s => s.taskId === a.id && s.studentId === me.id);
  let body = '';

  if (!sub) {
    body = `
      <div class="block-label">Твой ответ</div>
      <textarea class="textarea" id="sText" placeholder="Напиши ответ здесь..."></textarea>
      <div class="field" style="margin-top:12px">
        <label class="label">Ссылка (фото работы, документ)</label>
        <input class="input" id="sLink" placeholder="https://...">
      </div>
      <button class="btn btn-primary" data-act="submit-work" data-id="${a.id}">Отправить куратору</button>`;
  } else if (sub.score == null) {
    body = `
      <div class="block-label">Твой ответ</div>
      <div class="answer">${esc(sub.text) || '<span class="muted">— только ссылка —</span>'}</div>
      ${sub.link ? `<a class="link" href="${esc(sub.link)}" target="_blank" rel="noopener">Прикреплённая ссылка →</a>` : ''}
      <div class="notice">Отправлено ${fmtFull(sub.at)}. Ждёт проверки куратора.</div>`;
  } else {
    body = `
      <div class="block-label">Твой ответ</div>
      <div class="answer">${esc(sub.text) || '<span class="muted">— только ссылка —</span>'}</div>
      ${sub.link ? `<a class="link" href="${esc(sub.link)}" target="_blank" rel="noopener">Прикреплённая ссылка →</a>` : ''}

      <div class="result">
        <div class="result-score">${sub.score}<span> / ${a.max || 3}</span></div>
        <div class="result-label">балл от куратора</div>
      </div>

      ${sub.feedback ? `
        <div class="block-label">Комментарий куратора</div>
        <div class="answer">${esc(sub.feedback)}</div>` : ''}`;
  }

  return `
  ${studentTopbar(me)}
  <div class="container">
    <div class="page">
      <button class="btn btn-ghost btn-sm" data-act="back">← Все задания</button>

      <div class="card" style="margin-top:16px">
        <div class="badges">
          ${a.no ? `<span class="badge">№ ${esc(a.no)}</span>` : ''}
          <span class="badge neutral">${esc(a.type)}</span>
          ${a.due ? `<span class="badge blue">до ${fmt(a.due)}</span>` : ''}
        </div>

        <h1 class="display h1" style="margin:10px 0 4px">${esc(a.topic || 'Задание')}</h1>

        <div class="block-label">Задание</div>
        <div class="answer">${esc(a.text) || '—'}</div>
        ${a.link ? `<a class="link" href="${esc(a.link)}" target="_blank" rel="noopener">Материал к заданию →</a>` : ''}

        <hr class="hr">
        ${body}
      </div>
    </div>
  </div>`;
}

/* ============================================================
   9. ДЕЙСТВИЯ
   ============================================================ */
function doLoginCurator() {
  const pin = $('pin').value.trim();
  if (pin !== String(state.curatorPin)) return toast('Неверный PIN');
  session = { role: 'curator' };
  localStorage.setItem(LS_SES, JSON.stringify(session));
  ui.tab = 'students';
  render();
}

function doLoginStudent() {
  const sid = $('sid')?.value;
  const pin = $('spin').value.trim();
  const st  = state.students.find(s => s.id === sid);
  if (!st || String(st.pin) !== pin) return toast('Неверный PIN');
  session = { role: 'student', id: st.id };
  localStorage.setItem(LS_SES, JSON.stringify(session));
  ui.openTask = null;
  render();
}

function addStudent() {
  const name = $('nName').value.trim();
  if (!name) return toast('Введи имя');
  let pin = $('nPin').value.trim();
  if (!pin) pin = String(Math.floor(1000 + Math.random() * 9000));
  state.students.push({ id: uid(), name, pin });
  save();
}

function delStudent(id) {
  if (!confirm('Удалить ученика вместе с его работами?')) return;
  state.students = state.students.filter(s => s.id !== id);
  state.subs     = state.subs.filter(s => s.studentId !== id);
  save();
}

function addTask() {
  const topic = $('tTopic').value.trim();
  const text  = $('tText').value.trim();
  if (!topic && !text) return toast('Заполни тему или текст задания');

  state.tasks.push({
    id: uid(),
    studentId: $('tWho').value,
    no:   $('tNo').value || '',
    type: $('tType').value,
    max:  Number($('tMax').value) || 3,
    topic, text,
    link: $('tLink').value.trim(),
    due:  $('tDue').value,
    at:   new Date().toISOString()
  });
  save();
  toast('Задание выдано');
}

function delTask(id) {
  if (!confirm('Удалить задание?')) return;
  state.tasks = state.tasks.filter(t => t.id !== id);
  state.subs  = state.subs.filter(s => s.taskId !== id);
  save();
}

function submitWork(taskId) {
  const text = $('sText').value.trim();
  const link = $('sLink').value.trim();
  if (!text && !link) return toast('Напиши ответ или прикрепи ссылку');

  const sid = session.id;
  const obj = {
    id: taskId + '_' + sid,
    taskId, studentId: sid, text, link,
    at: new Date().toISOString(),
    score: null,
    feedback: ''
  };

  const existing = state.subs.find(s => s.id === obj.id);
  if (existing) Object.assign(existing, obj);
  else state.subs.push(obj);

  ui.openTask = null;
  save();
  toast('Работа отправлена');
}

function saveCheck(id) {
  const s = state.subs.find(x => x.id === id);
  if (!s) return;

  const raw = $('cScore').value.trim();
  if (raw === '') return toast('Поставь балл');

  s.score      = Number(raw);
  s.feedback   = $('cFb').value.trim();
  s.checkedAt  = new Date().toISOString();

  ui.openCheck = null;
  save();
  toast('Проверка сохранена');
}

function savePin() {
  const pin = $('newPin').value.trim();
  if (!pin) return toast('PIN не может быть пустым');
  state.curatorPin = pin;
  save();
  toast('PIN обновлён');
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tezis-backup-' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function resetAll() {
  if (!confirm('Стереть ВСЕ данные: учеников, задания, работы?')) return;
  state = blank();
  save();
  toast('Данные стёрты');
}

/* ============================================================
   10. СОБЫТИЯ
   ============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id  = el.dataset.id;

  switch (act) {
    case 'role':
      ui.role = el.dataset.role; render(); break;

    case 'login-curator': doLoginCurator(); break;
    case 'login-student': doLoginStudent(); break;

    case 'logout':
      session = null;
      localStorage.removeItem(LS_SES);
      ui = { role: 'curator', tab: 'students', openTask: null, openCheck: null, filter: 'pending' };
      render();
      break;

    case 'tab':
      ui.tab = el.dataset.tab;
      ui.openCheck = null;
      render();
      break;

    case 'set-filter':
      ui.filter = el.dataset.filter; render(); break;

    case 'add-student': addStudent(); break;
    case 'del-student': delStudent(id); break;
    case 'add-task':    addTask(); break;
    case 'del-task':    delTask(id); break;

    case 'open-task':  ui.openTask = id;  render(); break;
    case 'open-check': ui.openCheck = id; render(); break;
    case 'back':       ui.openTask = null; ui.openCheck = null; render(); break;

    case 'submit-work': submitWork(id); break;
    case 'save-check':  saveCheck(id);  break;
    case 'save-pin':    savePin();      break;

    case 'export': exportJSON(); break;
    case 'import': $('importFile').click(); break;
    case 'reset':  resetAll(); break;
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (!session && ui.role === 'curator' && $('pin')) doLoginCurator();
  if (!session && ui.role === 'student' && $('spin')) doLoginStudent();
});

$('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      state = Object.assign(blank(), parsed);
      state.students = state.students || [];
      state.tasks    = state.tasks    || [];
      state.subs     = state.subs     || [];
      save();
      toast('Данные загружены');
    } catch (err) {
      toast('Не получилось прочитать файл');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

/* ============================================================
   СТАРТ
   ============================================================ */
boot();
</script>
</body>
</html>
